name: Empaquetar MathUtils Studio

# Genera la aplicación nativa e independiente de Java para Windows (instalador de Inno Setup) y Linux
# (tar.gz y .deb). Se ejecuta a mano o al subir una etiqueta v*, que además publica una release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: --installer
          - os: ubuntu-latest
            name: linux-x64
            args: --deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Instalar herramientas del paquete .deb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Probar la librería y la aplicación
        run: mvn -B test

      - name: Construir la aplicación nativa
        run: python mathutils-app/packaging/tools/build_app.py --skip-maven ${{ matrix.args }}

      - name: Guardar los paquetes
        uses: actions/upload-artifact@v4
        with:
          name: MathUtilsStudio-${{ matrix.name }}
          path: |
            mathutils-app/packaging/build/dist/*-setup.exe
            mathutils-app/packaging/build/dist/*.tar.gz
            mathutils-app/packaging/build/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: paquetes/*
