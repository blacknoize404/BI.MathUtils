# Textos en español de las resoluciones paso a paso.
# Los marcadores ${nombre} se sustituyen por la expresión del parámetro correspondiente.

# ---- Presentación
solution.kind.DERIVATIVE.problem=Derivar ${f} respecto a ${x}.
solution.kind.DERIVATIVE.problem.order=Derivar ${f} ${k} veces respecto a ${x}.
solution.kind.LIMIT.problem=Calcular el límite de ${f} cuando ${x} tiende a ${a}.
solution.kind.LIMIT.problem.RIGHT=Calcular el límite de ${f} cuando ${x} tiende a ${a} por la derecha.
solution.kind.LIMIT.problem.LEFT=Calcular el límite de ${f} cuando ${x} tiende a ${a} por la izquierda.
solution.kind.INTEGRAL.problem=Calcular la integral de ${f} respecto a ${x}.
solution.status.DOES_NOT_EXIST=El límite no existe.
solution.steps=Pasos
solution.result=Resultado
solution.status.SOLVED=Resuelto.
solution.status.NON_ELEMENTAL=El resultado existe, pero no se puede escribir con funciones elementales.
solution.status.UNSOLVED=Todavía no sé resolver esto.

# ---- Generales
rule.SIMPLIFY.title=Simplificar
rule.SIMPLIFY.text=Simplificamos la expresión.

# ---- Derivadas
rule.DIFF_CONSTANT.title=Derivada de una constante
rule.DIFF_CONSTANT.text=La derivada de una constante es 0.

rule.DIFF_OTHER_VARIABLE.title=Otra variable como constante
rule.DIFF_OTHER_VARIABLE.text=Derivamos respecto a ${x}, así que ${y} se trata como una constante y su derivada es 0.

rule.DIFF_VARIABLE.title=Derivada de la variable
rule.DIFF_VARIABLE.text=La derivada de ${x} respecto a ${x} es 1.

rule.DIFF_CONSTANT_MULTIPLE.title=Constante por función
rule.DIFF_CONSTANT_MULTIPLE.text=Una constante que multiplica sale de la derivada: (c·f)' = c·f'. Aquí c = ${c} y f = ${f}.

rule.DIFF_SUM.title=Regla de la suma
rule.DIFF_SUM.text=La derivada de una suma es la suma de las derivadas: (f + g)' = f' + g'. Derivamos cada término por separado.

rule.DIFF_POWER.title=Regla de la potencia
rule.DIFF_POWER.text=(${x}^n)' = n·${x}^(n − 1), con n = ${n}.

rule.DIFF_PRODUCT.title=Regla del producto
rule.DIFF_PRODUCT.text=(f·g)' = f'·g + f·g'. Aquí f = ${f} y g = ${g}.

rule.DIFF_QUOTIENT.title=Regla del cociente
rule.DIFF_QUOTIENT.text=(f/g)' = (f'·g − f·g') / g². Aquí f = ${f} y g = ${g}.

rule.DIFF_CHAIN.title=Regla de la cadena
rule.DIFF_CHAIN.text=(F(u))' = F'(u)·u'. Tomamos u = ${u}: derivamos la función exterior respecto a u y multiplicamos por la derivada de u.

rule.DIFF_EXPONENTIAL_E.title=Derivada de la exponencial
rule.DIFF_EXPONENTIAL_E.text=(e^${x})' = e^${x}.

rule.DIFF_EXPONENTIAL.title=Exponencial de base a
rule.DIFF_EXPONENTIAL.text=(a^${x})' = a^${x}·ln(a), con a = ${a}.

rule.DIFF_LN.title=Derivada del logaritmo natural
rule.DIFF_LN.text=(ln(${x}))' = 1/${x}.

rule.DIFF_POWER_GENERAL.title=Derivación logarítmica
rule.DIFF_POWER_GENERAL.text=La base y el exponente dependen de la variable, así que tomamos logaritmos: (f^g)' = f^g·(g'·ln(f) + g·f'/f). Aquí f = ${f} y g = ${g}.

rule.DIFF_SIN.title=Derivada del seno
rule.DIFF_SIN.text=(sin(${x}))' = cos(${x}).

rule.DIFF_COS.title=Derivada del coseno
rule.DIFF_COS.text=(cos(${x}))' = −sin(${x}).

rule.DIFF_TAN.title=Derivada de la tangente
rule.DIFF_TAN.text=(tan(${x}))' = sec(${x})².

rule.DIFF_COT.title=Derivada de la cotangente
rule.DIFF_COT.text=(cot(${x}))' = −csc(${x})².

rule.DIFF_SEC.title=Derivada de la secante
rule.DIFF_SEC.text=(sec(${x}))' = sec(${x})·tan(${x}).

rule.DIFF_CSC.title=Derivada de la cosecante
rule.DIFF_CSC.text=(csc(${x}))' = −csc(${x})·cot(${x}).

rule.DIFF_ASIN.title=Derivada del arcoseno
rule.DIFF_ASIN.text=(asin(${x}))' = 1/√(1 − ${x}²).

rule.DIFF_ACOS.title=Derivada del arcocoseno
rule.DIFF_ACOS.text=(acos(${x}))' = −1/√(1 − ${x}²).

rule.DIFF_ATAN.title=Derivada del arcotangente
rule.DIFF_ATAN.text=(atan(${x}))' = 1/(1 + ${x}²).

rule.DIFF_SINH.title=Derivada del seno hiperbólico
rule.DIFF_SINH.text=(sinh(${x}))' = cosh(${x}).

rule.DIFF_COSH.title=Derivada del coseno hiperbólico
rule.DIFF_COSH.text=(cosh(${x}))' = sinh(${x}).

rule.DIFF_TANH.title=Derivada de la tangente hiperbólica
rule.DIFF_TANH.text=(tanh(${x}))' = 1 − tanh(${x})².

rule.DIFF_ABS.title=Derivada del valor absoluto
rule.DIFF_ABS.text=(|${x}|)' = ${x}/|${x}|, para ${x} distinto de 0.

rule.DIFF_ERF.title=Derivada de la función error
rule.DIFF_ERF.text=(erf(${x}))' = (2/√π)·e^(−${x}²).

rule.DIFF_ORDER.title=Derivada de orden superior
rule.DIFF_ORDER.text=Derivada número ${k}: derivamos de nuevo el resultado anterior.

# ---- Orden de operaciones
order.parentheses=Primero lo que está entre paréntesis.
order.error.DIVISION_BY_ZERO=No se puede dividir entre 0.
order.error.UNDEFINED=El resultado no está definido en los números reales.

order.POWER.title=Potencia
order.POWER.text=Calculamos la potencia ${a}^${b} = ${r}. Las potencias se resuelven antes que los productos y las sumas.
order.FUNCTION.title=Función
order.FUNCTION.text=Evaluamos ${f}(${a}) = ${r}. Las funciones se resuelven junto con las potencias, antes que los productos y las sumas.
order.NEGATION.title=Cambio de signo
order.NEGATION.text=Cambiamos el signo de ${a}: −${a} = ${r}.
order.MULTIPLICATION.title=Multiplicación
order.MULTIPLICATION.text=Multiplicamos ${a} · ${b} = ${r}. Las multiplicaciones y divisiones se resuelven antes que las sumas y las restas, de izquierda a derecha.
order.DIVISION.title=División
order.DIVISION.text=Dividimos ${a} ÷ ${b} = ${r}. Las multiplicaciones y divisiones se resuelven antes que las sumas y las restas, de izquierda a derecha.
order.ADDITION.title=Suma
order.ADDITION.text=Sumamos ${a} + ${b} = ${r}. Las sumas y las restas se resuelven al final, de izquierda a derecha.
order.SUBTRACTION.title=Resta
order.SUBTRACTION.text=Restamos ${a} − ${b} = ${r}. Las sumas y las restas se resuelven al final, de izquierda a derecha.

# ---- Límites
rule.LIMIT_CONSTANT.title=Límite de una constante
rule.LIMIT_CONSTANT.text=El límite de una constante es la propia constante.

rule.LIMIT_DIRECT.title=Sustitución directa
rule.LIMIT_DIRECT.text=Sustituimos ${x} = ${a}: la función es continua en ese punto, así que el límite es el valor que resulta.

rule.LIMIT_ALGEBRA.title=Álgebra de límites
rule.LIMIT_ALGEBRA.text=Calculamos el límite de cada parte y las combinamos con las propiedades de los límites (suma, producto y potencia).

rule.LIMIT_INFINITY_RATIONAL.title=Cociente de polinomios en el infinito
rule.LIMIT_INFINITY_RATIONAL.text=En el infinito, un cociente de polinomios se comporta como el cociente de sus términos de mayor grado: el numerador tiene grado ${n} y el denominador grado ${m}.

rule.LIMIT_LHOPITAL_ZERO.title=Regla de L'Hôpital (0/0)
rule.LIMIT_LHOPITAL_ZERO.text=Al sustituir, numerador y denominador tienden a 0 (forma indeterminada 0/0). Por la regla de L'Hôpital, lim f/g = lim f'/g'. Derivamos el numerador ${n} y el denominador ${d} por separado.

rule.LIMIT_LHOPITAL_INFINITY.title=Regla de L'Hôpital (∞/∞)
rule.LIMIT_LHOPITAL_INFINITY.text=Numerador y denominador tienden a infinito (forma indeterminada ∞/∞). Por la regla de L'Hôpital, lim f/g = lim f'/g'. Derivamos el numerador ${n} y el denominador ${d} por separado.

rule.LIMIT_PRODUCT_TO_QUOTIENT.title=Producto de la forma 0·∞
rule.LIMIT_PRODUCT_TO_QUOTIENT.text=Es un producto de la forma 0·∞. Lo escribimos como cociente: ${n} dividido entre ${d}, que es una forma indeterminada 0/0 o ∞/∞.

rule.LIMIT_COMBINE_FRACTIONS.title=Combinar fracciones
rule.LIMIT_COMBINE_FRACTIONS.text=La suma es de la forma ∞ − ∞. Combinamos las fracciones en una sola.

rule.LIMIT_CONJUGATE.title=Multiplicar por el conjugado
rule.LIMIT_CONJUGATE.text=Es de la forma ∞ − ∞ con raíces. Multiplicamos y dividimos por el conjugado para eliminarlas: (A − B)(A + B) = A² − B².

rule.LIMIT_EXPONENTIAL_FORM.title=Forma exponencial
rule.LIMIT_EXPONENTIAL_FORM.text=La potencia es una forma indeterminada (1^∞, 0^0 o ∞^0). Escribimos b^e = e^(e·ln b) y calculamos el límite del exponente ${e}·ln(${b}).

rule.LIMIT_SIDES.title=Límites laterales
rule.LIMIT_SIDES.text=Calculamos el límite por la izquierda y por la derecha. Si coinciden, ese valor es el límite.

rule.LIMIT_OSCILLATES.title=Función oscilante
rule.LIMIT_OSCILLATES.text=La función oscila sin acercarse a un valor: el límite no existe.

rule.LIMIT_DIFFERENT_SIDES.title=Límites laterales distintos
rule.LIMIT_DIFFERENT_SIDES.text=Los límites por la izquierda y por la derecha son distintos: el límite no existe.

# ---- Integrales
rule.INT_CONSTANT.title=Integral de una constante
rule.INT_CONSTANT.text=∫ c d${x} = c·${x}.

rule.INT_CONSTANT_MULTIPLE.title=Constante por función
rule.INT_CONSTANT_MULTIPLE.text=Una constante que multiplica sale de la integral: ∫ c·f d${x} = c·∫ f d${x}. Aquí c = ${c} y f = ${f}.

rule.INT_SUM.title=Regla de la suma
rule.INT_SUM.text=La integral de una suma es la suma de las integrales: ∫ (f + g) d${x} = ∫ f d${x} + ∫ g d${x}. Integramos cada término.

rule.INT_POWER.title=Regla de la potencia
rule.INT_POWER.text=∫ ${x}^n d${x} = ${x}^(n + 1)/(n + 1), para n distinto de −1. Aquí n = ${n}.

rule.INT_RECIPROCAL.title=Integral de 1/x
rule.INT_RECIPROCAL.text=∫ 1/${x} d${x} = ln|${x}|.

rule.INT_EXPONENTIAL_E.title=Integral de la exponencial
rule.INT_EXPONENTIAL_E.text=∫ e^${x} d${x} = e^${x}.

rule.INT_EXPONENTIAL.title=Exponencial de base a
rule.INT_EXPONENTIAL.text=∫ a^${x} d${x} = a^${x}/ln(a), con a = ${a}.

rule.INT_SIN.title=Integral del seno
rule.INT_SIN.text=∫ sin(${x}) d${x} = −cos(${x}).

rule.INT_COS.title=Integral del coseno
rule.INT_COS.text=∫ cos(${x}) d${x} = sin(${x}).

rule.INT_TAN.title=Integral de la tangente
rule.INT_TAN.text=∫ tan(${x}) d${x} = −ln|cos(${x})|.

rule.INT_COT.title=Integral de la cotangente
rule.INT_COT.text=∫ cot(${x}) d${x} = ln|sin(${x})|.

rule.INT_SEC.title=Integral de la secante
rule.INT_SEC.text=∫ sec(${x}) d${x} = ln|sec(${x}) + tan(${x})|.

rule.INT_CSC.title=Integral de la cosecante
rule.INT_CSC.text=∫ csc(${x}) d${x} = −ln|csc(${x}) + cot(${x})|.

rule.INT_SEC_SQUARED.title=Integral de sec²
rule.INT_SEC_SQUARED.text=∫ sec²(${x}) d${x} = tan(${x}).

rule.INT_CSC_SQUARED.title=Integral de csc²
rule.INT_CSC_SQUARED.text=∫ csc²(${x}) d${x} = −cot(${x}).

rule.INT_SEC_TAN.title=Integral de sec·tan
rule.INT_SEC_TAN.text=∫ sec(${x})·tan(${x}) d${x} = sec(${x}).

rule.INT_CSC_COT.title=Integral de csc·cot
rule.INT_CSC_COT.text=∫ csc(${x})·cot(${x}) d${x} = −csc(${x}).

rule.INT_SINH.title=Integral del seno hiperbólico
rule.INT_SINH.text=∫ sinh(${x}) d${x} = cosh(${x}).

rule.INT_COSH.title=Integral del coseno hiperbólico
rule.INT_COSH.text=∫ cosh(${x}) d${x} = sinh(${x}).

rule.INT_TANH.title=Integral de la tangente hiperbólica
rule.INT_TANH.text=∫ tanh(${x}) d${x} = ln(cosh(${x})).

rule.INT_ATAN_FORM.title=Forma del arcotangente
rule.INT_ATAN_FORM.text=∫ 1/(${x}² + a²) d${x} = (1/a)·atan(${x}/a), con a = ${a}.

rule.INT_ASIN_FORM.title=Forma del arcoseno
rule.INT_ASIN_FORM.text=∫ 1/√(a² − ${x}²) d${x} = asin(${x}/a), con a = ${a}.

rule.INT_LOG_FORM.title=Forma logarítmica
rule.INT_LOG_FORM.text=∫ 1/(${x}² − a²) d${x} = (1/(2a))·ln|(${x} − a)/(${x} + a)|, con a = ${a}.

rule.INT_ASINH_FORM.title=Forma del arcoseno hiperbólico
rule.INT_ASINH_FORM.text=∫ 1/√(${x}² + c) d${x} = ln|${x} + √(${x}² + c)|, con c = ${c}.

rule.INT_EXPAND.title=Expandir antes de integrar
rule.INT_EXPAND.text=Desarrollamos el producto o la potencia para poder integrar término a término.

rule.INT_SUBSTITUTION.title=Sustitución
rule.INT_SUBSTITUTION.text=Tomamos ${s} = ${u}, así que d${s} = ${du} d${x}. La integral queda en función de ${s}: ∫ ${g} d${s}.

rule.INT_PARTS.title=Integración por partes
rule.INT_PARTS.text=∫ u dv = u·v − ∫ v du. Tomamos u = ${u} y dv = ${dv} d${x}; entonces du = ${du} d${x} y v = ${v}.

rule.INT_CYCLE.title=La integral se repite
rule.INT_CYCLE.text=La integral original reaparece. Llamamos I a la integral buscada: I = (${a}) + (${c})·I. Despejando, I = (${a})/(1 − (${c})).

rule.LIMIT_DOMINANT_TERMS.title=Términos dominantes
rule.LIMIT_DOMINANT_TERMS.text=Con el término de mayor grado de cada parte, la función se comporta como ${c}·${x}^(${p}). Si el exponente es negativo el límite es 0, si es 0 es el coeficiente y si es positivo es infinito.

rule.LIMIT_ABSOLUTE_VALUE.title=Valor absoluto por un lado
rule.LIMIT_ABSOLUTE_VALUE.text=Por este lado de ${a}, el signo de lo que hay dentro del valor absoluto no cambia. Lo reescribimos sin valor absoluto.

rule.INT_POLYNOMIAL_DIVISION.title=División de polinomios
rule.INT_POLYNOMIAL_DIVISION.text=El grado del numerador ${n} no es menor que el del denominador ${d}, así que dividimos los polinomios: el cociente es ${q} y el resto es ${r}.
rule.INT_PARTIAL_FRACTIONS.title=Fracciones parciales
rule.INT_PARTIAL_FRACTIONS.text=Factorizamos el denominador: ${d} = ${factored}. Escribimos la fracción como suma de fracciones más simples, una por cada factor y cada potencia, con coeficientes por determinar. Al igualar los coeficientes de ambos numeradores y resolver el sistema lineal sale ${parts}.
rule.INT_QUADRATIC_SPLIT.title=Separar el numerador
rule.INT_QUADRATIC_SPLIT.text=La derivada del denominador ${q} es ${dq}. Escribimos el numerador como un múltiplo de ${dq} más una constante, para que una parte sea una derivada logarítmica y la otra una constante sobre ${q}.
rule.INT_COMPLETE_SQUARE.title=Completar el cuadrado
rule.INT_COMPLETE_SQUARE.text=El polinomio ${q} no tiene raíces racionales. Completando el cuadrado queda ${s}, y con ${u} desplazada la integral toma la forma de arcotangente.
rule.INT_REDUCTION.title=Fórmula de reducción
rule.INT_REDUCTION.text=Para ∫ 1/(${x}² + ${d})^${k} d${x} usamos la fórmula de reducción ∫ 1/(${x}²+a)^n = ${x}/(2a(n−1)(${x}²+a)^(n−1)) + (2n−3)/(2a(n−1)) ∫ 1/(${x}²+a)^(n−1), que baja la potencia en uno.
rule.INT_TRIG_ODD_POWER.title=Exponente impar
rule.INT_TRIG_ODD_POWER.text=Hay un exponente impar. Separamos un factor ${keep} y escribimos el resto con ${other} usando sen²${x} + cos²${x} = 1. Así la integral queda ∫ ${r} d${x}, lista para una sustitución con ${other}.
rule.INT_TRIG_HALF_ANGLE.title=Ángulo mitad
rule.INT_TRIG_HALF_ANGLE.text=Con exponentes pares usamos las fórmulas del ángulo mitad: sen²${x} = (1 − cos 2${x})/2 y cos²${x} = (1 + cos 2${x})/2. El integrando queda ${r}.
rule.INT_TRIG_TAN_SUBSTITUTION.title=Tangente y secante
rule.INT_TRIG_TAN_SUBSTITUTION.text=Los exponentes son pares y su suma es negativa. Escribimos el integrando con tan ${x} y sec²${x} usando sec²${x} = 1 + tan²${x}: queda ${r}. Como sec²${x} es la derivada de tan ${x}, sirve la sustitución con la tangente.
rule.INT_TRIG_TAN_REDUCTION.title=Potencia de tangente
rule.INT_TRIG_TAN_REDUCTION.text=Para la potencia ${n} de la tangente usamos tan²${x} = sec²${x} − 1. Resulta ∫ tan^n ${x} d${x} = tan^(n−1) ${x}/(n−1) − ∫ tan^(n−2) ${x} d${x}.
rule.INT_TRIG_COT_REDUCTION.title=Potencia de cotangente
rule.INT_TRIG_COT_REDUCTION.text=Para la potencia ${n} de la cotangente usamos cot²${x} = csc²${x} − 1. Resulta ∫ cot^n ${x} d${x} = −cot^(n−1) ${x}/(n−1) − ∫ cot^(n−2) ${x} d${x}.
rule.INT_TRIG_SEC_REDUCTION.title=Potencia de secante
rule.INT_TRIG_SEC_REDUCTION.text=Para la potencia impar ${n} de la secante integramos por partes y obtenemos ∫ sec^n ${x} d${x} = sec^(n−2) ${x} tan ${x}/(n−1) + (n−2)/(n−1) ∫ sec^(n−2) ${x} d${x}.
rule.INT_TRIG_CSC_REDUCTION.title=Potencia de cosecante
rule.INT_TRIG_CSC_REDUCTION.text=Para la potencia impar ${n} de la cosecante integramos por partes y obtenemos ∫ csc^n ${x} d${x} = −csc^(n−2) ${x} cot ${x}/(n−1) + (n−2)/(n−1) ∫ csc^(n−2) ${x} d${x}.
rule.INT_TRIG_PRODUCT_TO_SUM.title=Producto a suma
rule.INT_TRIG_PRODUCT_TO_SUM.text=Un producto de senos y cosenos de ángulos distintos se pasa a suma con sen A cos B = ½[sen(A+B) + sen(A−B)], cos A cos B = ½[cos(A−B) + cos(A+B)] y sen A sen B = ½[cos(A−B) − cos(A+B)]. Queda ${r}.
rule.INT_TRIG_WEIERSTRASS.title=Sustitución tan(x/2)
rule.INT_TRIG_WEIERSTRASS.text=Toda función racional de seno y coseno se vuelve racional con ${s} = tan(${x}/2): sen ${x} = 2${s}/(1+${s}²), cos ${x} = (1−${s}²)/(1+${s}²) y d${x} = 2 d${s}/(1+${s}²). La integral queda ∫ ${g} d${s}.
rule.INT_RADICAL_SUBSTITUTION.title=Sustitución para quitar la raíz
rule.INT_RADICAL_SUBSTITUTION.text=La raíz de una expresión lineal se elimina con ${s} = ${u}. Entonces ${x} y d${x} se escriben con ${s}, y la integral queda ∫ ${g} d${s}.
rule.INT_RADICAL_COMPLETE_SQUARE.title=Completar el cuadrado en la raíz
rule.INT_RADICAL_COMPLETE_SQUARE.text=Completamos el cuadrado del radicando: ${q} = ${c}. Con ${s} = ${shift} (d${s} = d${x}) la integral queda ∫ ${g} d${s}.
rule.INT_TRIG_SUBSTITUTION_SIN.title=Sustitución trigonométrica con seno
rule.INT_TRIG_SUBSTITUTION_SIN.text=El radicando ${q} tiene la forma a² − b²${x}². Tomamos ${x} = ${xs}, así que d${x} = ${dx} d${s} y la raíz es ${root} (con cos ${s} > 0). La integral queda ∫ ${g} d${s}. Al final volvemos a ${x} con ${s} = arcsen(${x}/${m}).
rule.INT_TRIG_SUBSTITUTION_TAN.title=Sustitución trigonométrica con tangente
rule.INT_TRIG_SUBSTITUTION_TAN.text=El radicando ${q} tiene la forma a² + b²${x}². Tomamos ${x} = ${xs}, así que d${x} = ${dx} d${s} y la raíz es ${root}. La integral queda ∫ ${g} d${s}. Al final volvemos a ${x} con ${s} = arctan(${x}/${m}).
rule.INT_TRIG_SUBSTITUTION_SEC.title=Sustitución trigonométrica con secante
rule.INT_TRIG_SUBSTITUTION_SEC.text=El radicando ${q} tiene la forma b²${x}² − a². Tomamos ${x} = ${xs} (con ${x} > 0), así que d${x} = ${dx} d${s} y la raíz es ${root}. La integral queda ∫ ${g} d${s}. Al final volvemos a ${x} con ${s} = arccos(${m}/|${x}|).
rule.INT_ROOT_DIFFERENCE_FORM.title=Raíz de a² − x²
rule.INT_ROOT_DIFFERENCE_FORM.text=Con c = ${c}, la fórmula de ∫ √(c − ${x}²) d${x} (que sale con ${x} = √c sen t) es ${x}·√(c − ${x}²)/2 + (c/2)·arcsen(${x}/√c).
rule.INT_ROOT_SUM_FORM.title=Raíz de x² + c
rule.INT_ROOT_SUM_FORM.text=Con c = ${c}, la fórmula de ∫ √(${x}² + c) d${x} es ${x}·√(${x}² + c)/2 + (c/2)·ln|${x} + √(${x}² + c)|.
rule.DIFF_SI.title=Derivada del seno integral
rule.DIFF_SI.text=(Si(${x}))' = sen(${x})/${x}.
rule.DIFF_CI.title=Derivada del coseno integral
rule.DIFF_CI.text=(Ci(${x}))' = cos(${x})/${x}.
rule.DIFF_EI.title=Derivada de la exponencial integral
rule.DIFF_EI.text=(Ei(${x}))' = e^${x}/${x}.
rule.DIFF_LI.title=Derivada del logaritmo integral
rule.DIFF_LI.text=(li(${x}))' = 1/ln(${x}).
rule.INT_ERF_FORM.title=Función de error
rule.INT_ERF_FORM.text=La integral de e^(−${a}${x}²) no se puede escribir con funciones elementales. Se define con la función de error erf(z) = (2/√π)∫_0^z e^(−t²) dt; con z = √${a}·${x} resulta √π/(2√${a})·erf(√${a}·${x}).
rule.INT_SI_FORM.title=Seno integral
rule.INT_SI_FORM.text=sen(${x})/${x} no tiene antiderivada elemental. Su primitiva se define como el seno integral Si(${x}) = ∫_0^${x} sen(t)/t dt.
rule.INT_CI_FORM.title=Coseno integral
rule.INT_CI_FORM.text=cos(${x})/${x} no tiene antiderivada elemental. Su primitiva se define como el coseno integral Ci(${x}) = γ + ln ${x} + ∫_0^${x} (cos t − 1)/t dt.
rule.INT_EI_FORM.title=Exponencial integral
rule.INT_EI_FORM.text=e^${x}/${x} no tiene antiderivada elemental. Su primitiva se define como la exponencial integral Ei(${x}).
rule.INT_LI_FORM.title=Logaritmo integral
rule.INT_LI_FORM.text=Esta integral no es elemental. Con la sustitución ${x}^${n} = e^s se reduce a la exponencial integral, y su primitiva es el logaritmo integral li(${x}^${n}) = Ei(${n}·ln ${x}).
rule.INT_EI_REDUCTION.title=Reducción con la exponencial integral
rule.INT_EI_REDUCTION.text=Integrando por partes, ∫ e^${x}/${x}^${n} d${x} = −e^${x}/((${n}−1)·${x}^(${n}−1)) + 1/(${n}−1)·∫ e^${x}/${x}^(${n}−1) d${x}, que baja la potencia en uno.
solution.kind.INTEGRAL.problem.definite=Calcular la integral de ${f} respecto a ${x} entre ${lower} y ${upper}.
solution.status.DOES_NOT_EXIST.INTEGRAL=La integral diverge: no tiene un valor finito.
rule.INT_DEFINITE_ANTIDERIVATIVE.title=Buscar una antiderivada
rule.INT_DEFINITE_ANTIDERIVATIVE.text=Para usar la regla de Barrow necesitamos una antiderivada F de ${f}. La calculamos primero, con la constante de integración fuera.
rule.INT_BARROW.title=Regla de Barrow
rule.INT_BARROW.text=Entre ${p} y ${q}, la integral es F(${q}) − F(${p}) = ${Fq} − ${Fp}.
rule.INT_ADD_PIECES.title=Sumar las partes
rule.INT_ADD_PIECES.text=La integral completa es la suma de las integrales de cada parte.
rule.INT_ENDPOINT_LIMIT.title=Valor en el extremo con un límite
rule.INT_ENDPOINT_LIMIT.text=En ${a} la antiderivada no se puede evaluar directamente, así que calculamos su límite cuando ${x} tiende a ${a}.
rule.INT_IMPROPER.title=Integral impropia
rule.INT_IMPROPER.text=Hay un extremo infinito o un punto donde el integrando no está acotado, así que es una integral impropia. En esos puntos sustituimos el valor de la antiderivada por un límite.
rule.INT_SPLIT_SINGULARITY.title=Partir en la singularidad
rule.INT_SPLIT_SINGULARITY.text=El integrando no está definido en ${s}, que está dentro del intervalo. Partimos la integral en ese punto y tratamos cada parte como impropia, con límites laterales. Si alguna parte diverge, diverge toda la integral.
rule.INT_SPLIT_ABSOLUTE.title=Partir donde cambia el valor absoluto
rule.INT_SPLIT_ABSOLUTE.text=El valor absoluto de ${g} cambia de expresión donde ${g} = 0. Partimos el intervalo en esos puntos y, en cada trozo, |${g}| es ${g} o −(${g}): se integra cada trozo y se suman.
rule.INT_ABSOLUTE_PIECE.title=Un trozo sin valor absoluto
rule.INT_ABSOLUTE_PIECE.text=Entre ${p} y ${q}, ${g} tiene signo ${sign}, así que |${g}| = ${h} y la integral es la de ese trozo.
rule.INT_DIVERGES.title=La integral diverge
rule.INT_DIVERGES.text=El límite de la antiderivada en ${a} es infinito o no existe, así que la integral no tiene un valor finito.
rule.INT_ODD_SYMMETRY.title=Simetría impar
rule.INT_ODD_SYMMETRY.text=El integrando es impar y el intervalo es simétrico, de −${a} a ${a}: las áreas a ambos lados se cancelan y la integral vale 0.
rule.INT_EVEN_SYMMETRY.title=Simetría par
rule.INT_EVEN_SYMMETRY.text=El integrando es par y el intervalo es simétrico, de −${a} a ${a}: la integral es el doble de la que va de 0 a ${a}.
rule.INT_REVERSE_BOUNDS.title=Intercambiar los extremos
rule.INT_REVERSE_BOUNDS.text=El extremo inferior ${a} es mayor que el superior ${b}. Intercambiarlos cambia el signo de la integral.
rule.INT_EMPTY_INTERVAL.title=Extremos iguales
rule.INT_EMPTY_INTERVAL.text=Los dos extremos son ${a}, así que el intervalo no tiene longitud y la integral vale 0.
rule.INT_P_TEST_INFINITY.title=Criterio de la p en el infinito
rule.INT_P_TEST_INFINITY.text=Una integral de 1/x^p de ${a} a infinito, con ${a} > 0, converge si y solo si p > 1. Aquí el integrando es una constante por 1/x^(${p}).
rule.INT_P_TEST_ZERO.title=Criterio de la p en el cero
rule.INT_P_TEST_ZERO.text=Una integral de 1/x^p de 0 a ${b} converge si y solo si p < 1. Aquí el integrando es una constante por 1/x^(${p}).
rule.INT_GAMMA.title=Integral de tipo gamma
rule.INT_GAMMA.text=Una integral de 0 a infinito de x^p · e^(−k·x), con p = ${p} y k = ${k}, es la función gamma: vale Γ(p + 1) / k^(p + 1). Γ(p + 1) se escribe p!, y aquí da ${value}.
rule.INT_GAMMA_LOG.title=Integral de tipo gamma con logaritmo
rule.INT_GAMMA_LOG.text=Derivar respecto al exponente la integral de x^s · e^(−k·x) deja un factor ln x dentro. Así, la integral de 0 a infinito de x^p · ln x · e^(−k·x), con p = ${p} y k = ${k}, es Γ(p + 1) / k^(p + 1) · (ψ(p + 1) − ln k), donde ψ es la función digamma (la derivada logarítmica de Γ). Aquí da ${value}.
rule.INT_ASSUME_POSITIVE.title=Suponer el parámetro positivo
rule.INT_ASSUME_POSITIVE.text=El límite en el infinito de la antiderivada depende del signo de ${p}: la integral solo converge si ${p} > 0 (si no, diverge o no está definida). Suponemos ${p} > 0 y el resultado vale para esos valores.
rule.INT_SPLIT_EXPONENT.title=Separar la parte constante del exponente
rule.INT_SPLIT_EXPONENT.text=Como e^(a + b) = e^a · e^b, la parte del exponente que no depende de ${x} sale como una constante: e^(…) = ${c} · ${f}.
rule.INT_GAMMA_SCALE.title=Cambio de escala
rule.INT_GAMMA_SCALE.text=Con u = ${k}·x, dx = du/${k} y x^p = u^p/${k}^p. La integral queda 1/${k}^(p + 1) por la integral de u^p · e^(−u) entre 0 e infinito, con p = ${p}.
rule.INT_GAMMA_DEFINITION.title=Definición de la función gamma
rule.INT_GAMMA_DEFINITION.text=Por definición, la integral de u^p · e^(−u) entre 0 e infinito es Γ(p + 1), que se escribe p! (converge si p > −1). Aquí es ${u}.
rule.INT_GAMMA_PARAMETER.title=Derivar respecto al exponente
rule.INT_GAMMA_PARAMETER.text=Sea F(s) = la integral de x^s · e^(−${k}·x) entre 0 e infinito, que vale Γ(s + 1)/${k}^(s + 1). Como la derivada de x^s respecto a s es x^s · ln x, la integral con ln x es F'(s), en s = ${p}.
rule.INT_GAMMA_DIGAMMA.title=Derivar Γ con la función digamma
rule.INT_GAMMA_DIGAMMA.text=Se cumple Γ'(z) = Γ(z)·ψ(z), donde ψ es la digamma, y la derivada de ${k}^(−(s + 1)) es −ln ${k} · ${k}^(−(s + 1)). Así F'(s) = Γ(s + 1)/${k}^(s + 1) · (ψ(s + 1) − ln ${k}), y en s = ${p} da ${u}.
rule.INT_FORM_PARTIAL_FRACTIONS.title=Fracciones parciales
rule.INT_FORM_PARTIAL_FRACTIONS.text=Factorizamos x² − a² = (x − a)(x + a), con a = ${a}, y lo descomponemos en fracciones parciales: 1/(x² − a²) = 1/(2a) · (1/(x − a) − 1/(x + a)).
rule.INT_FORM_COMBINE_LOGS.title=Integrar cada fracción y juntar los logaritmos
rule.INT_FORM_COMBINE_LOGS.text=La integral de 1/(x − a) es ln|x − a| y la de 1/(x + a) es ln|x + a|. Restamos y usamos ln A − ln B = ln(A/B).
rule.INT_FORM_TRIG_SUBSTITUTION.title=Sustitución trigonométrica
rule.INT_FORM_TRIG_SUBSTITUTION.text=Con c = ${c}, tomamos x = √c·sen t. Entonces dx = √c·cos t dt y √(c − x²) = √c·cos t, así que la integral pasa a ser la de ${u} respecto a t.
rule.INT_FORM_COS_SQUARED.title=Integral de cos² t
rule.INT_FORM_COS_SQUARED.text=Usamos cos² t = (1 + cos 2t)/2: la integral de c·cos² t es (c/2)·(t + sen t·cos t).
rule.INT_FORM_BACK_SUBSTITUTION.title=Volver a la variable original
rule.INT_FORM_BACK_SUBSTITUTION.text=Con x = √c·sen t, t = arcsen(x/√c) y sen t·cos t = x·√(c − x²)/c. Sustituimos.
rule.INT_FORM_HYPERBOLIC_SUBSTITUTION.title=Sustitución hiperbólica
rule.INT_FORM_HYPERBOLIC_SUBSTITUTION.text=Con c = ${c}, tomamos x = √c·senh t. Entonces dx = √c·cosh t dt y √(x² + c) = √c·cosh t, así que la integral pasa a ser la de ${u} respecto a t.
rule.INT_FORM_HYPERBOLIC_SQUARED.title=Integral de cosh² t
rule.INT_FORM_HYPERBOLIC_SQUARED.text=Usamos cosh² t = (1 + cosh 2t)/2: la integral de c·cosh² t es (c/2)·(t + senh t·cosh t).
rule.INT_FORM_HYPERBOLIC_BACK.title=Volver a la variable original
rule.INT_FORM_HYPERBOLIC_BACK.text=Con x = √c·senh t, t = ln|x + √(x² + c)| − ln √c y senh t·cosh t = x·√(x² + c)/c. Sustituimos (la constante −ln √c se absorbe en la constante de integración).
rule.LIMIT_SPECIAL_VALUE.title=Valores de las funciones especiales
rule.LIMIT_SPECIAL_VALUE.text=Con el valor ya puesto, el factorial y la digamma se calculan con números exactos: n! = 1·2·…·n y ψ(n) = 1 + 1/2 + … + 1/(n − 1) − γ. Aquí ${u} = ${v}.
rule.LIMIT_LEADING_TERM.title=Término de mayor grado
rule.LIMIT_LEADING_TERM.text=Para ${x} muy grande, una suma se comporta como su término de mayor grado: los demás pesan cada vez menos. Aquí ${before} se comporta como ${after}.
rule.LIMIT_CONJUGATE_NUMERATOR.title=Producto por el conjugado
rule.LIMIT_CONJUGATE_NUMERATOR.text=El numerador queda (A − B)(A + B) = A² − B², sin raíces.
rule.LIMIT_KNOWN_VALUE.title=Valor conocido en el infinito
rule.LIMIT_KNOWN_VALUE.text=Cuando el argumento tiende a infinito, esta función tiende a un valor conocido: ${u} → ${v}.
rule.LIMIT_DOMAIN_ONE_SIDE.title=La función solo existe a un lado
rule.LIMIT_DOMAIN_ONE_SIDE.text=A un lado de ${a} la función no está definida en los reales (por ejemplo, el logaritmo de un número negativo), así que el límite es el que se calcula desde el otro lado.
rule.LIMIT_COMMON_BASE.title=Agrupar potencias con el mismo exponente
rule.LIMIT_COMMON_BASE.text=Con el mismo exponente, el cociente de potencias es la potencia del cociente: a^x / b^x = (a/b)^x. Así queda ${after}.
rule.LIMIT_DIVIDE_DOMINANT.title=Dividir entre la mayor potencia
rule.LIMIT_DIVIDE_DOMINANT.text=Dividimos numerador y denominador entre ${p}, la mayor potencia de ${x} que aparece. Los términos acotados (como sen x) divididos entre algo que crece tienden a 0. Queda ${after}.
rule.NESTED_INTEGRAL.title=Resolver primero la integral de dentro
rule.NESTED_INTEGRAL.text=La expresión lleva una integral de ${f} respecto a ${x}. La resolvemos por separado, aquí abajo, y usamos su valor en lo que sigue: ${value}.
rule.NESTED_DERIVATIVE.title=Resolver primero la derivada de dentro
rule.NESTED_DERIVATIVE.text=La expresión lleva la derivada de ${f} respecto a ${x}. La calculamos por separado y usamos su valor en lo que sigue: ${value}.
rule.NESTED_LIMIT.title=Resolver primero el límite de dentro
rule.NESTED_LIMIT.text=La expresión lleva el límite de ${f} cuando ${x} tiende a ${a}. Lo calculamos por separado y usamos su valor en lo que sigue: ${value}.
solution.kind.DERIVATIVE.problem.partial=Derivar ${f} parcialmente respecto a ${vars}, en ese orden.
solution.kind.DERIVATIVE.problem.partialSingle=Derivar ${f} parcialmente respecto a ${x}.
rule.DIFF_PARTIAL.title=Derivada parcial
rule.DIFF_PARTIAL.text=Derivada ${k} de ${n}: derivamos respecto a ${x} y tratamos las demás variables como constantes.
solution.kind.INTEGRAL.problem.multiple=Calcular la integral iterada de ${f} respecto a ${vars}, de dentro hacia fuera.
rule.INT_ITERATED.title=Integral iterada
rule.INT_ITERATED.text=Integral ${k} de ${n}: integramos respecto a ${x} y tratamos las demás variables como constantes.
rule.INT_ITERATED_DEFINITE.title=Integral iterada con límites
rule.INT_ITERATED_DEFINITE.text=Integral ${k} de ${n}: integramos respecto a ${x} entre ${lower} y ${upper}, y tratamos las demás variables como constantes. El resultado puede depender de las variables de las integrales exteriores.
solution.kind.LIMIT.problem.multiple=Calcular el límite de ${f} cuando ${vars} tiende a ${point}.
rule.LIMIT_MULTI_SUBSTITUTION.title=Función continua en el punto
rule.LIMIT_MULTI_SUBSTITUTION.text=Al sustituir el punto ${a} la expresión tiene un valor finito, así que la función es continua ahí y el límite es ese valor.
rule.LIMIT_MULTI_ITERATED.title=Límites iterados
rule.LIMIT_MULTI_ITERATED.text=Calculamos el límite en una variable y después en la otra, en los dos órdenes: uno da ${one} y el otro ${other}. Si los dos existen y son distintos, el límite no existe; si coinciden, todavía no demuestra nada.
rule.LIMIT_MULTI_PATHS.title=Caminos hacia el punto
rule.LIMIT_MULTI_PATHS.text=Nos acercamos al punto por distintos caminos. Por ${one} el límite es ${oneValue}, pero por ${other} es ${otherValue}.
rule.LIMIT_MULTI_DIFFERENT.title=El límite no existe
rule.LIMIT_MULTI_DIFFERENT.text=Hemos encontrado dos formas de acercarse al punto con resultados distintos (${one} y ${other}). Si el límite existiera, tendría que dar el mismo valor por todos los caminos, así que no existe.
rule.LIMIT_MULTI_POLAR_ZERO.title=Cota en coordenadas polares
rule.LIMIT_MULTI_POLAR_ZERO.text=Con u = r·cos θ y v = r·sen θ medidos desde el punto, el numerador es de orden ${p} en r y el denominador de orden ${q}, con la parte principal del denominador sin ceros en ningún ángulo. Entonces |f| ≤ C·r^(${p}−${q}) y, como ${p} > ${q}, tiende a 0 cuando r tiende a 0, sea cual sea el camino.
rule.LIMIT_MULTI_POLAR_INFINITE.title=Cota en coordenadas polares: crece sin límite
rule.LIMIT_MULTI_POLAR_INFINITE.text=Con u = r·cos θ y v = r·sen θ medidos desde el punto, el numerador es de orden ${p} en r y el denominador de orden ${q}, y las partes principales de los dos tienen signo fijo en todos los ángulos. Como ${p} < ${q}, |f| ≥ c·r^(${p}−${q}) crece sin límite cuando r tiende a 0, sea cual sea el camino.
rule.LIMIT_MULTI_CANCEL.title=Cancelar el factor común
rule.LIMIT_MULTI_CANCEL.text=Numerador y denominador comparten un factor que se anula en el punto. Lo factorizamos y lo cancelamos (fuera del punto la función no cambia, y el límite no depende de lo que pase en él): ${after}.
rule.LIMIT_MULTI_SQUEEZE.title=Acotada por algo que tiende a 0
rule.LIMIT_MULTI_SQUEEZE.text=La función es un producto de ${g}, que siempre está entre −1 y 1, por otra parte que tiende a 0. Entonces |f| ≤ |otra parte| → 0 y el límite es 0, sea cual sea el camino.
rule.LIMIT_MULTI_INFINITESIMAL.title=Equivalente en un infinitésimo
rule.LIMIT_MULTI_INFINITESIMAL.text=Como ${g} tiende a 0, sen(${g}) se comporta como ${g} (sen u / u → 1). Reemplazamos y queda ${after}.
rule.LIMIT_MULTI_NEW_VARIABLE.title=Cambio de variable
rule.LIMIT_MULTI_NEW_VARIABLE.text=Toda la expresión depende de ${g}, que tiende a ${a} al acercarse al punto. Con u = ${g}, el límite es el de una sola variable: ${after}.
rule.LIMIT_MULTI_POLAR_CONSTANT.title=Cociente de partes principales
rule.LIMIT_MULTI_POLAR_CONSTANT.text=Con coordenadas polares desde el punto, numerador y denominador son de orden ${p} en r, la parte principal del denominador no se anula en ningún ángulo y el cociente de partes principales es constante. Por eso el límite existe y vale esa constante, sea cual sea el camino.
rule.LIMIT_MULTI_CANDIDATE.title=Sin demostración
rule.LIMIT_MULTI_CANDIDATE.text=Por los ${count} caminos probados el límite da ${candidate}, pero comprobar caminos no demuestra que el límite exista. Falta una cota (por ejemplo, en polares o con el teorema del emparedado). Por eso no se da como resultado.

solution.kind.EQUATION.problem=Resolver ${l} ${op} ${r} para ${x}.
solution.kind.INEQUALITY.problem=Resolver la inecuación ${l} ${op} ${r} para ${x}.
solution.kind.FACTORIZATION.problem=Factorizar ${f}.
solution.kind.EXPANSION.problem=Desarrollar ${f}.

# ---- Álgebra: ecuaciones, inecuaciones y polinomios
rule.ALG_MOVE_TO_ONE_SIDE.title=Pasar todo a un lado
rule.ALG_MOVE_TO_ONE_SIDE.text=Pasamos todos los términos a un lado para comparar con cero: ${l} ${op} ${r}.

rule.ALG_SIMPLIFY.title=Reducir términos
rule.ALG_SIMPLIFY.text=Reducimos los términos semejantes: ${l} ${op} ${r}.

rule.ALG_ADD_TO_BOTH.title=Sumar a los dos lados
rule.ALG_ADD_TO_BOTH.text=Sumamos ${t} a los dos lados: ${l} ${op} ${r}.

rule.ALG_MULTIPLY_BOTH.title=Multiplicar los dos lados
rule.ALG_MULTIPLY_BOTH.text=Multiplicamos los dos lados por ${t}: ${l} ${op} ${r}.

rule.ALG_DIVIDE_BOTH.title=Dividir los dos lados
rule.ALG_DIVIDE_BOTH.text=Dividimos los dos lados entre ${t}: ${l} ${op} ${r}.

rule.ALG_MULTIPLY_BOTH_NEGATIVE.title=Multiplicar por un número negativo
rule.ALG_MULTIPLY_BOTH_NEGATIVE.text=Multiplicamos los dos lados por ${t}, que es negativo, así que la desigualdad cambia de sentido: ${l} ${op} ${r}.

rule.ALG_DIVIDE_BOTH_NEGATIVE.title=Dividir entre un número negativo
rule.ALG_DIVIDE_BOTH_NEGATIVE.text=Dividimos los dos lados entre ${t}, que es negativo, así que la desigualdad cambia de sentido: ${l} ${op} ${r}.

rule.ALG_ISOLATE.title=Despejar la incógnita
rule.ALG_ISOLATE.text=Despejamos ${x}: ${l} ${op} ${r}.

rule.ALG_IDENTITY.title=Siempre se cumple
rule.ALG_IDENTITY.text=Los dos lados son iguales para cualquier valor de ${x}, así que la relación se cumple siempre.

rule.ALG_CONTRADICTION.title=Nunca se cumple
rule.ALG_CONTRADICTION.text=Queda ${l} ${op} ${r}, que es falso para cualquier valor de ${x}: no hay solución.

rule.ALG_FACTOR.title=Factorizar
rule.ALG_FACTOR.text=Factorizamos: ${f} = ${g}.

rule.ALG_ZERO_PRODUCT.title=Producto igual a cero
rule.ALG_ZERO_PRODUCT.text=Un producto vale cero solo si alguno de sus factores vale cero. Igualamos a cero cada factor: ${list}.

rule.ALG_ZERO_FACTOR.title=Resolver un factor
rule.ALG_ZERO_FACTOR.text=Resolvemos ${l} ${op} ${r}.

rule.ALG_QUADRATIC_FORM.title=Forma general
rule.ALG_QUADRATIC_FORM.text=Es una ecuación de segundo grado a·${x}² + b·${x} + c = 0 con a = ${a}, b = ${b} y c = ${c}.

rule.ALG_DISCRIMINANT.title=Discriminante
rule.ALG_DISCRIMINANT.text=El discriminante es Δ = b² − 4ac = ${d}.

rule.ALG_DISCRIMINANT_POSITIVE.title=Dos soluciones reales
rule.ALG_DISCRIMINANT_POSITIVE.text=Como Δ = ${d} es positivo, hay dos soluciones reales distintas.

rule.ALG_DISCRIMINANT_ZERO.title=Una solución doble
rule.ALG_DISCRIMINANT_ZERO.text=Como Δ = 0, hay una única solución real (doble).

rule.ALG_DISCRIMINANT_NEGATIVE.title=Sin soluciones reales
rule.ALG_DISCRIMINANT_NEGATIVE.text=Como Δ = ${d} es negativo, la raíz cuadrada no existe en los reales y no hay soluciones reales.

rule.ALG_QUADRATIC_FORMULA.title=Fórmula general
rule.ALG_QUADRATIC_FORMULA.text=Aplicamos x = (−b ± √(b² − 4ac)) / (2a) con a = ${a}, b = ${b} y c = ${c}.

rule.ALG_COMPLETE_SQUARE.title=Completar el cuadrado
rule.ALG_COMPLETE_SQUARE.text=Dividimos entre ${a} y sumamos ${k} = (b/2)² a los dos lados para que el lado izquierdo sea un cuadrado perfecto: ${l} ${op} ${r}.

rule.ALG_PERFECT_SQUARE_FORM.title=Escribir el cuadrado
rule.ALG_PERFECT_SQUARE_FORM.text=El lado izquierdo es el cuadrado de un binomio: ${l} ${op} ${r}.

rule.ALG_SQUARE_ROOT.title=Raíz cuadrada en los dos lados
rule.ALG_SQUARE_ROOT.text=Sacamos raíz cuadrada en los dos lados, sin olvidar los dos signos (±): ${l} ${op} ${r}.

rule.ALG_RATIONAL_ROOT_CANDIDATES.title=Candidatos a raíz racional
rule.ALG_RATIONAL_ROOT_CANDIDATES.text=Si hay una raíz racional p/q, p divide a ${a0} y q divide a ${an}. Los candidatos son: ${list}.

rule.ALG_ROOT_FOUND.title=Una raíz
rule.ALG_ROOT_FOUND.text=Al probar ${r} el polinomio vale 0, así que ${r} es una raíz y (${factor}) es un factor.

rule.ALG_SYNTHETIC_DIVISION.title=División sintética (Ruffini)
rule.ALG_SYNTHETIC_DIVISION.text=Dividimos entre (${factor}) con la regla de Ruffini y queda el cociente ${q}.

rule.ALG_SUBSTITUTION.title=Cambio de variable
rule.ALG_SUBSTITUTION.text=Hacemos el cambio ${u} = ${e}: ${l} ${op} ${r}.

rule.ALG_BACK_SUBSTITUTION.title=Deshacer el cambio
rule.ALG_BACK_SUBSTITUTION.text=Volvemos a ${x} con ${u} = ${e}: ${l} ${op} ${r}.

rule.ALG_DOMAIN.title=Dominio
rule.ALG_DOMAIN.text=El denominador no puede ser cero: ${cond}.

rule.ALG_PARAMETERS.title=Letras como parámetros
rule.ALG_PARAMETERS.text=Despejamos ${x}; las demás letras (${p}) se tratan como números fijos.

rule.ALG_PARAM_NONZERO.title=Coeficiente distinto de cero
rule.ALG_PARAM_NONZERO.text=Suponemos que ${a} no es cero: si lo fuera, la ecuación cambiaría de grado y habría que verla aparte.

rule.ALG_PARAM_REAL.title=Cuándo hay soluciones reales
rule.ALG_PARAM_REAL.text=Las soluciones son reales solo si ${d} ≥ 0.

rule.ALG_CLEAR_DENOMINATORS.title=Quitar denominadores
rule.ALG_CLEAR_DENOMINATORS.text=Multiplicamos los dos lados por el denominador común ${d}: ${l} ${op} ${r}.

rule.ALG_NUMERATOR_ZERO.title=Numerador igual a cero
rule.ALG_NUMERATOR_ZERO.text=Una fracción vale cero cuando su numerador vale cero y su denominador no: ${l} ${op} ${r}.

rule.ALG_ISOLATE_RADICAL.title=Aislar el radical
rule.ALG_ISOLATE_RADICAL.text=Dejamos la raíz sola en un lado: ${l} ${op} ${r}.

rule.ALG_SQUARE_BOTH_SIDES.title=Elevar al cuadrado
rule.ALG_SQUARE_BOTH_SIDES.text=Elevamos al cuadrado los dos lados. Esto puede añadir soluciones falsas, así que habrá que comprobar: ${l} ${op} ${r}.

rule.ALG_CHECK_SOLUTIONS.title=Comprobar las soluciones
rule.ALG_CHECK_SOLUTIONS.text=Sustituimos cada candidato en la ecuación original: ${list}.

rule.ALG_CHECK_VALID.title=Solución válida
rule.ALG_CHECK_VALID.text=Con ${x} = ${v} los dos lados valen lo mismo, así que es solución.

rule.ALG_CHECK_EXTRANEOUS.title=Solución falsa
rule.ALG_CHECK_EXTRANEOUS.text=Con ${x} = ${v} los dos lados no coinciden: es una solución extraña que apareció al elevar al cuadrado.

rule.ALG_ABS_CASES.title=Casos del valor absoluto
rule.ALG_ABS_CASES.text=|a| = b significa a = b o a = −b. Con a = ${g} y b = ${h}, resolvemos los dos casos.

rule.ALG_ABS_NEGATIVE.title=Valor absoluto negativo
rule.ALG_ABS_NEGATIVE.text=Un valor absoluto nunca es negativo, así que ${l} ${op} ${r} no tiene solución.

rule.ALG_TAKE_LOG.title=Tomar logaritmos
rule.ALG_TAKE_LOG.text=Tomamos logaritmo natural en los dos lados para bajar el exponente: ${l} ${op} ${r}.

rule.ALG_TO_EXPONENTIAL.title=Pasar a forma exponencial
rule.ALG_TO_EXPONENTIAL.text=ln(a) = b equivale a a = e^b: ${l} ${op} ${r}.

rule.ALG_LOG_DOMAIN.title=Dominio del logaritmo
rule.ALG_LOG_DOMAIN.text=El argumento de un logaritmo tiene que ser positivo: ${cond}.

rule.ALG_TRIG_GENERAL.title=Soluciones de una ecuación trigonométrica
rule.ALG_TRIG_GENERAL.text=Las funciones trigonométricas son periódicas: además de la solución principal hay infinitas más. Con k entero: ${list}.

rule.ALG_TRIG_OUT_OF_RANGE.title=Fuera del rango
rule.ALG_TRIG_OUT_OF_RANGE.text=El seno y el coseno solo toman valores entre −1 y 1, y ${r} está fuera: no hay solución.

rule.ALG_NUMERIC_ROOT.title=Buscar la raíz numéricamente
rule.ALG_NUMERIC_ROOT.text=No hay una fórmula exacta para esta ecuación. Buscamos una raíz cerca de ${x0} con el método de bisección y la afinamos: ${x} ≈ ${v}.
rule.ALG_NUM_WHY_POLY.title=Por qué no se puede despejar
rule.ALG_NUM_WHY_POLY.text=Es un polinomio de grado ${n} sin raíces racionales ni factores de menor grado que se vean. Para grado 5 o más no existe una fórmula general con raíces (teorema de Abel–Ruffini), así que ${x} no se puede despejar y hay que aproximarla.
rule.ALG_NUM_WHY_MIXED.title=Por qué no se puede despejar
rule.ALG_NUM_WHY_MIXED.text=La ecuación mezcla términos de distinta naturaleza (${kinds}) en ${x}. Ninguna operación de despeje (sumar o restar, multiplicar o dividir, factorizar, elevar a una potencia, tomar logaritmos o exponenciales) deja ${x} sola: lo que desharía un término estropea el otro. Por eso no hay una solución exacta con funciones elementales y hay que aproximarla.
rule.ALG_NUM_WHY_GENERIC.title=Por qué no se puede despejar
rule.ALG_NUM_WHY_GENERIC.text=Ningún método de despeje (lineal, cuadrático, factorización, radicales, logaritmos…) resuelve esta ecuación en ${x}, así que se estudia la función y se aproxima la solución.
rule.ALG_NUM_DOMAIN.title=Dominio
rule.ALG_NUM_DOMAIN.text=Por los logaritmos hay que imponer ${conditions}. Por tanto, ${domain}: solo pueden existir soluciones ahí.
rule.ALG_NUM_FUNCTION.title=Definir la función
rule.ALG_NUM_FUNCTION.text=Sea f(${x}) = ${f}. Resolver la ecuación es encontrar los valores de ${x} con f(${x}) = 0.
rule.ALG_NUM_MONOTONE.title=Estudiar la monotonía
rule.ALG_NUM_MONOTONE.text=Derivamos: f'(${x}) = ${d}. Esta derivada tiene signo fijo en todo el dominio, así que f es estrictamente creciente.
rule.ALG_NUM_MONOTONE_TERMS.title=Estudiar la monotonía
rule.ALG_NUM_MONOTONE_TERMS.text=Derivamos: f'(${x}) = ${d}. En todo el dominio cada término tiene el mismo signo: ${parts}. Luego la derivada no se anula y f es estrictamente creciente.
rule.ALG_NUM_MONOTONE_DOWN.title=Estudiar la monotonía
rule.ALG_NUM_MONOTONE_DOWN.text=Derivamos: f'(${x}) = ${d}. Esta derivada es negativa en todo el dominio, así que f es estrictamente decreciente.
rule.ALG_NUM_MONOTONE_TERMS_DOWN.title=Estudiar la monotonía
rule.ALG_NUM_MONOTONE_TERMS_DOWN.text=Derivamos: f'(${x}) = ${d}. En todo el dominio cada término es negativo: ${parts}. Luego la derivada no se anula y f es estrictamente decreciente.
rule.ALG_NUM_LIMITS.title=Analizar los límites
rule.ALG_NUM_LIMITS.text=En el extremo izquierdo (${leftPoint}), f(${x}) tiende a ${left}; en el derecho (${rightPoint}), tiende a ${right}.
rule.ALG_NUM_EXISTENCE_ONE.title=Existencia y unicidad
rule.ALG_NUM_EXISTENCE_ONE.text=f es continua en el dominio, estrictamente monótona y cambia de signo entre los dos extremos. Por el teorema de Bolzano existe al menos una raíz, y por ser monótona es única.
rule.ALG_NUM_EXISTENCE_NONE.title=Existencia y unicidad
rule.ALG_NUM_EXISTENCE_NONE.text=f es continua y estrictamente monótona, pero no cambia de signo entre los extremos: no hay ninguna raíz real.
rule.ALG_NUM_BRACKET.title=Acotar la raíz
rule.ALG_NUM_BRACKET.text=Evaluamos: f(${a}) ≈ ${fa} y f(${b}) ≈ ${fb}. Como tienen signos distintos, la raíz está entre ${a} y ${b}.
rule.ALG_NUM_CHECK.title=Comprobar
rule.ALG_NUM_CHECK.text=Con ${x} ≈ ${v}, f(${v}) ≈ ${fv}, que es prácticamente 0.

rule.ALG_NUMERIC_TOO_MANY.title=Demasiadas soluciones
rule.ALG_NUMERIC_TOO_MANY.text=${f} cambia de signo más de ${n} veces entre −50 y 50: hay demasiadas soluciones (seguramente infinitas) para darlas una a una. El conjunto se da como la condición que cumplen sus elementos.

rule.ALG_NUMERIC_SAMPLES.title=Algunas raíces de ejemplo
rule.ALG_NUMERIC_SAMPLES.text=Las más cercanas al origen, con ${f} = 0, son aproximadamente: ${list}.

rule.INEQ_CRITICAL_POINTS.title=Puntos críticos
rule.INEQ_CRITICAL_POINTS.text=La expresión solo puede cambiar de signo en las raíces del numerador y en los puntos donde no existe: ${list}.

rule.INEQ_SIGN_TEST.title=Probar un valor
rule.INEQ_SIGN_TEST.text=En ${interval} probamos ${t}: la expresión vale ${v}, así que su signo es ${sign}.

rule.INEQ_ENDPOINTS_INCLUDED.title=Extremos incluidos
rule.INEQ_ENDPOINTS_INCLUDED.text=Como el símbolo ${op} admite la igualdad, los puntos donde la expresión vale cero (${list}) forman parte de la solución.
rule.INEQ_ENDPOINTS_EXCLUDED.title=Extremos excluidos
rule.INEQ_ENDPOINTS_EXCLUDED.text=Los puntos ${list} no forman parte de la solución: o el símbolo ${op} no admite la igualdad, o la expresión no está definida en ellos.
rule.INEQ_OUT_OF_DOMAIN.title=Fuera del dominio
rule.INEQ_OUT_OF_DOMAIN.text=En ${interval} la expresión no está definida, así que no hay solución ahí.

rule.INEQ_ABS_CASES.title=Valor absoluto en una desigualdad
rule.INEQ_ABS_CASES.text=${l} ${op} ${r} equivale a ${cases}.

rule.INEQ_ALWAYS.title=Siempre cierta
rule.INEQ_ALWAYS.text=La desigualdad ${l} ${op} ${r} se cumple para todos los valores del dominio.

rule.INEQ_NEVER.title=Nunca cierta
rule.INEQ_NEVER.text=La desigualdad ${l} ${op} ${r} no se cumple para ningún valor.

rule.INEQ_COLLECT.title=Reunir los intervalos
rule.INEQ_COLLECT.text=Reunimos los intervalos donde se cumple ${l} ${op} ${r}.

rule.POLY_COMMON_FACTOR.title=Factor común
rule.POLY_COMMON_FACTOR.text=Sacamos el factor común ${g}: ${f} = ${g}·(${rest}).

rule.POLY_DIFF_SQUARES.title=Diferencia de cuadrados
rule.POLY_DIFF_SQUARES.text=a² − b² = (a − b)(a + b), con a = ${a} y b = ${b}: ${f} = ${g}.

rule.POLY_PERFECT_SQUARE.title=Trinomio cuadrado perfecto
rule.POLY_PERFECT_SQUARE.text=Con a = ${a} y b = ${b}, el término central ${m} es ±2ab, así que ${f} = ${g}.

rule.POLY_SUM_CUBES.title=Suma de cubos
rule.POLY_SUM_CUBES.text=a³ + b³ = (a + b)(a² − ab + b²), con a = ${a} y b = ${b}: ${f} = ${g}.

rule.POLY_DIFF_CUBES.title=Diferencia de cubos
rule.POLY_DIFF_CUBES.text=a³ − b³ = (a − b)(a² + ab + b²), con a = ${a} y b = ${b}: ${f} = ${g}.

rule.POLY_TRINOMIAL_NUMBERS.title=Dos números que suman y multiplican
rule.POLY_TRINOMIAL_NUMBERS.text=Buscamos dos números que sumen ${b} y que multipliquen ${ac}: son ${m} y ${n}.

rule.POLY_TRINOMIAL_SPLIT.title=Partir el término central
rule.POLY_TRINOMIAL_SPLIT.text=Escribimos el término central como suma: ${f} = ${g}.

rule.POLY_GROUPING.title=Agrupar
rule.POLY_GROUPING.text=Agrupamos los términos de dos en dos y sacamos factor común en cada grupo: ${g}.

rule.POLY_COMMON_BINOMIAL.title=Factor común binomio
rule.POLY_COMMON_BINOMIAL.text=Los dos grupos tienen el factor ${b}, que sacamos: ${f} = ${g}.

rule.POLY_QUADRATIC_ROOTS.title=Factorizar con las raíces
rule.POLY_QUADRATIC_ROOTS.text=Las raíces son ${r1} y ${r2}, y a·(x − r₁)(x − r₂) con a = ${a} da ${f} = ${g}.

rule.POLY_COMPLETE_SQUARE.title=Completar el cuadrado
rule.POLY_COMPLETE_SQUARE.text=Sumamos y restamos ${k} para formar un cuadrado perfecto: ${f} = ${g}.

rule.POLY_SUBSTITUTION.title=Cambio de variable
rule.POLY_SUBSTITUTION.text=Como solo aparecen potencias de ${x}^${k}, hacemos ${u} = ${e} y factorizamos ${p}.

rule.POLY_IRREDUCIBLE.title=No se puede factorizar
rule.POLY_IRREDUCIBLE.text=Con este método no se puede factorizar ${f} usando números racionales.

rule.POLY_NOT_APPLICABLE.title=Método no aplicable
rule.POLY_NOT_APPLICABLE.text=Este método no sirve para ${f}.

rule.POLY_DISTRIBUTE.title=Propiedad distributiva
rule.POLY_DISTRIBUTE.text=Multiplicamos cada término de un factor por cada término del otro: ${f} = ${g}.

rule.POLY_BINOMIAL.title=Binomio de Newton
rule.POLY_BINOMIAL.text=(a + b)ⁿ = Σ C(n, k)·aⁿ⁻ᵏ·bᵏ, con a = ${a}, b = ${b} y n = ${n}: ${f} = ${g}.

rule.POLY_MULTINOMIAL.title=Teorema multinomial
rule.POLY_MULTINOMIAL.text=Cada término lleva el coeficiente n!/(k₁!·k₂!···) con k₁ + k₂ + ··· = ${n}: ${f} = ${g}.

rule.POLY_COLLECT.title=Reducir términos semejantes
rule.POLY_COLLECT.text=Juntamos los términos con las mismas potencias: ${f} = ${g}.

rule.POLY_RESULT.title=Resultado
rule.POLY_RESULT.text=${f} = ${g}.

# ---- Métodos de factorización
method.factor.AUTO.title=Automático
method.factor.AUTO.desc=Prueba los métodos por orden hasta factorizar del todo.
method.factor.COMMON_FACTOR.title=Factor común
method.factor.COMMON_FACTOR.desc=Sirve cuando todos los términos comparten un número o una variable.
method.factor.DIFFERENCE_OF_SQUARES.title=Diferencia de cuadrados
method.factor.DIFFERENCE_OF_SQUARES.desc=Sirve para a² − b²: se factoriza como (a − b)(a + b).
method.factor.PERFECT_SQUARE.title=Trinomio cuadrado perfecto
method.factor.PERFECT_SQUARE.desc=Sirve para a² ± 2ab + b²: es el cuadrado de un binomio.
method.factor.SUM_DIFFERENCE_OF_CUBES.title=Suma o diferencia de cubos
method.factor.SUM_DIFFERENCE_OF_CUBES.desc=Sirve para a³ ± b³.
method.factor.TRINOMIAL.title=Trinomio ax² + bx + c
method.factor.TRINOMIAL.desc=Busca dos números que sumen b y multipliquen ac, y agrupa.
method.factor.GROUPING.title=Agrupación
method.factor.GROUPING.desc=Sirve con cuatro términos que se pueden agrupar de dos en dos con un factor común.
method.factor.RATIONAL_ROOTS.title=Raíces racionales (Ruffini)
method.factor.RATIONAL_ROOTS.desc=Busca raíces racionales con el teorema de la raíz racional y divide con la regla de Ruffini.
method.factor.QUADRATIC_FORMULA.title=Fórmula general
method.factor.QUADRATIC_FORMULA.desc=Para ax² + bx + c con discriminante no negativo: usa las raíces, a(x − r₁)(x − r₂).
method.factor.COMPLETE_SQUARE.title=Completar el cuadrado
method.factor.COMPLETE_SQUARE.desc=Para ax² + bx + c con discriminante no negativo: lo convierte en una diferencia de cuadrados.
method.factor.SUBSTITUTION.title=Cambio de variable
method.factor.SUBSTITUTION.desc=Sirve cuando solo hay potencias de x^k (por ejemplo x⁴ − 5x² + 4).

rule.ALG_OTHER_SOLUTION.title=La otra solución
rule.ALG_OTHER_SOLUTION.text=Con el signo contrario sale la otra solución: ${l} ${op} ${r}.
rule.ALG_RAISE_BOTH_SIDES.title=Elevar a una potencia
rule.ALG_RAISE_BOTH_SIDES.text=Elevamos los dos lados a la potencia ${n} para quitar la raíz: ${l} ${op} ${r}.

# ---- Métodos para resolver ecuaciones
method.solve.AUTO.title=Automático
method.solve.AUTO.desc=Elige el método más natural para este tipo de ecuación.
method.solve.ISOLATE.title=Despejar
method.solve.ISOLATE.desc=Ecuación de primer grado: se pasan los términos y se divide.
method.solve.FACTORING.title=Factorizar
method.solve.FACTORING.desc=Se factoriza y se iguala a cero cada factor.
method.solve.SQUARE_ROOT.title=Raíz cuadrada
method.solve.SQUARE_ROOT.desc=Sirve para x² = k, sin término en x.
method.solve.COMPLETE_SQUARE.title=Completar el cuadrado
method.solve.COMPLETE_SQUARE.desc=Convierte el lado izquierdo en un cuadrado perfecto y saca la raíz.
method.solve.QUADRATIC_FORMULA.title=Fórmula general
method.solve.QUADRATIC_FORMULA.desc=Sirve para cualquier ecuación de segundo grado.
method.solve.RATIONAL_ROOTS.title=Raíces racionales (Ruffini)
method.solve.RATIONAL_ROOTS.desc=Prueba las raíces racionales posibles y divide el polinomio.
method.solve.SUBSTITUTION.title=Cambio de variable
method.solve.SUBSTITUTION.desc=Sirve cuando solo hay potencias de x^k, o una exponencial o función trigonométrica repetida.
method.solve.ZERO_NUMERATOR.title=Numerador igual a cero
method.solve.ZERO_NUMERATOR.desc=Ecuación con fracciones: el numerador se anula y el denominador no.
method.solve.ISOLATE_RADICAL.title=Aislar el radical
method.solve.ISOLATE_RADICAL.desc=Se deja la raíz sola, se eleva y se comprueban las soluciones.
method.solve.ABSOLUTE_CASES.title=Casos del valor absoluto
method.solve.ABSOLUTE_CASES.desc=Se resuelven por separado los dos signos del valor absoluto.
method.solve.LOGARITHMS.title=Logaritmos y exponenciales
method.solve.LOGARITHMS.desc=Se toman logaritmos o se pasa a forma exponencial.
method.solve.INVERSE_TRIG.title=Funciones trigonométricas inversas
method.solve.INVERSE_TRIG.desc=Se usa la función inversa y la periodicidad.
method.solve.NUMERIC.title=Numérico
method.solve.NUMERIC.desc=Busca las raíces con aproximaciones sucesivas cuando no hay fórmula.
method.solve.SIGN_CHART.title=Tabla de signos
method.solve.SIGN_CHART.desc=Busca los puntos donde la expresión cambia de signo y comprueba el signo en cada intervalo.

rule.DIFF_EXPAND_FIRST.title=Desarrollar antes de derivar
rule.DIFF_EXPAND_FIRST.text=Primero desarrollamos ${f} = ${g} y derivamos término a término.

rule.DIFF_SIMPLIFY_FIRST.title=Simplificar antes de derivar
rule.DIFF_SIMPLIFY_FIRST.text=Primero juntamos y simplificamos la fracción: ${f} = ${g}. Después derivamos.

rule.DIFF_QUOTIENT_AS_PRODUCT.title=Cociente como producto
rule.DIFF_QUOTIENT_AS_PRODUCT.text=En vez de la regla del cociente, escribimos ${f} como un producto con el denominador elevado a −1 y usamos la regla del producto y la de la cadena.

rule.DIFF_LOGARITHMIC.title=Derivación logarítmica
rule.DIFF_LOGARITHMIC.text=Si y = ${f}, tomamos logaritmos: ln y = ${g}. Derivamos los dos lados y despejamos y' = y·(ln y)'.

# ---- Métodos de derivación e integración
method.derivative.AUTO.title=Directo
method.derivative.AUTO.desc=Aplica las reglas de derivación tal como aparecen en la expresión.
method.derivative.EXPAND_FIRST.title=Desarrollar primero
method.derivative.EXPAND_FIRST.desc=Desarrolla productos y potencias de sumas y deriva término a término.
method.derivative.SIMPLIFY_FIRST.title=Simplificar primero
method.derivative.SIMPLIFY_FIRST.desc=Junta las fracciones y cancela los factores comunes antes de derivar.
method.derivative.QUOTIENT_AS_PRODUCT.title=Cociente como producto
method.derivative.QUOTIENT_AS_PRODUCT.desc=Evita la regla del cociente: usa producto y cadena con el denominador a la −1.
method.derivative.LOGARITHMIC.title=Derivación logarítmica
method.derivative.LOGARITHMIC.desc=Toma logaritmos y deriva ln f; sirve para productos largos y potencias con variable en el exponente.
method.integral.AUTO.title=Automático
method.integral.AUTO.desc=Prueba las técnicas por orden y usa la primera que sirve.
method.integral.LINEARITY.title=Linealidad
method.integral.LINEARITY.desc=Integra una suma término a término o saca una constante multiplicativa.
method.integral.TABLE.title=Tabla de integrales
method.integral.TABLE.desc=Es una integral inmediata de la tabla.
method.integral.SUBSTITUTION.title=Sustitución
method.integral.SUBSTITUTION.desc=Cambia de variable con u = g(x) cuando aparece g'(x) como factor.
method.integral.BY_PARTS.title=Integración por partes
method.integral.BY_PARTS.desc=∫u dv = uv − ∫v du, eligiendo u con la regla LIATE.
method.integral.PARTIAL_FRACTIONS.title=Fracciones parciales
method.integral.PARTIAL_FRACTIONS.desc=Descompone una fracción de polinomios en fracciones más simples.
method.integral.TRIGONOMETRIC.title=Identidades trigonométricas
method.integral.TRIGONOMETRIC.desc=Potencias de seno y coseno, ángulo mitad y producto a suma.
method.integral.RADICAL.title=Raíces
method.integral.RADICAL.desc=Sustituye la raíz, completa el cuadrado o usa una sustitución trigonométrica.
method.integral.COMPLETE_SQUARE.title=Completar el cuadrado
method.integral.COMPLETE_SQUARE.desc=Con un denominador de segundo grado: lo escribe como suma de cuadrados y usa el arcotangente o el logaritmo.
method.integral.REDUCTION.title=Fórmulas de reducción
method.integral.REDUCTION.desc=Baja la potencia paso a paso con una fórmula de reducción.
method.integral.POLYNOMIAL_DIVISION.title=División de polinomios
method.integral.POLYNOMIAL_DIVISION.desc=Divide numerador entre denominador para separar un polinomio y una fracción propia.
method.integral.EXPAND.title=Desarrollar
method.integral.EXPAND.desc=Desarrolla productos y potencias e integra término a término.

solution.kind.REWRITE.problem=Reescribir ${f} sustituyendo ${p} por ${q}.

rule.POLY_REWRITE.title=Sustituir un patrón
rule.POLY_REWRITE.text=Buscamos las partes de la expresión que tienen la forma ${p} y las sustituimos por ${q}.
solution.title=Solución paso a paso
solution.problem=Problema
