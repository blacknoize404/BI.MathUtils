# English texts for the step-by-step solutions.
# Placeholders like ${name} are replaced with the expression of the matching parameter.

# ---- Presentation
solution.kind.DERIVATIVE.problem=Differentiate ${f} with respect to ${x}.
solution.kind.DERIVATIVE.problem.order=Differentiate ${f} ${k} times with respect to ${x}.
solution.kind.LIMIT.problem=Compute the limit of ${f} as ${x} approaches ${a}.
solution.kind.LIMIT.problem.RIGHT=Compute the limit of ${f} as ${x} approaches ${a} from the right.
solution.kind.LIMIT.problem.LEFT=Compute the limit of ${f} as ${x} approaches ${a} from the left.
solution.kind.INTEGRAL.problem=Compute the integral of ${f} with respect to ${x}.
solution.status.DOES_NOT_EXIST=The limit does not exist.
solution.steps=Steps
solution.result=Result
solution.status.SOLVED=Solved.
solution.status.NON_ELEMENTAL=The result exists, but it cannot be written with elementary functions.
solution.status.UNSOLVED=I can't solve this yet.

# ---- General
rule.SIMPLIFY.title=Simplify
rule.SIMPLIFY.text=We simplify the expression.

# ---- Derivatives
rule.DIFF_CONSTANT.title=Derivative of a constant
rule.DIFF_CONSTANT.text=The derivative of a constant is 0.

rule.DIFF_OTHER_VARIABLE.title=Other variable as a constant
rule.DIFF_OTHER_VARIABLE.text=We differentiate with respect to ${x}, so ${y} is treated as a constant and its derivative is 0.

rule.DIFF_VARIABLE.title=Derivative of the variable
rule.DIFF_VARIABLE.text=The derivative of ${x} with respect to ${x} is 1.

rule.DIFF_CONSTANT_MULTIPLE.title=Constant multiple
rule.DIFF_CONSTANT_MULTIPLE.text=A constant factor comes out of the derivative: (c·f)' = c·f'. Here c = ${c} and f = ${f}.

rule.DIFF_SUM.title=Sum rule
rule.DIFF_SUM.text=The derivative of a sum is the sum of the derivatives: (f + g)' = f' + g'. We differentiate each term separately.

rule.DIFF_POWER.title=Power rule
rule.DIFF_POWER.text=(${x}^n)' = n·${x}^(n − 1), with n = ${n}.

rule.DIFF_PRODUCT.title=Product rule
rule.DIFF_PRODUCT.text=(f·g)' = f'·g + f·g'. Here f = ${f} and g = ${g}.

rule.DIFF_QUOTIENT.title=Quotient rule
rule.DIFF_QUOTIENT.text=(f/g)' = (f'·g − f·g') / g². Here f = ${f} and g = ${g}.

rule.DIFF_CHAIN.title=Chain rule
rule.DIFF_CHAIN.text=(F(u))' = F'(u)·u'. We take u = ${u}: we differentiate the outer function with respect to u and multiply by the derivative of u.

rule.DIFF_EXPONENTIAL_E.title=Derivative of the exponential
rule.DIFF_EXPONENTIAL_E.text=(e^${x})' = e^${x}.

rule.DIFF_EXPONENTIAL.title=Exponential with base a
rule.DIFF_EXPONENTIAL.text=(a^${x})' = a^${x}·ln(a), with a = ${a}.

rule.DIFF_LN.title=Derivative of the natural logarithm
rule.DIFF_LN.text=(ln(${x}))' = 1/${x}.

rule.DIFF_POWER_GENERAL.title=Logarithmic differentiation
rule.DIFF_POWER_GENERAL.text=Both the base and the exponent depend on the variable, so we take logarithms: (f^g)' = f^g·(g'·ln(f) + g·f'/f). Here f = ${f} and g = ${g}.

rule.DIFF_SIN.title=Derivative of sine
rule.DIFF_SIN.text=(sin(${x}))' = cos(${x}).

rule.DIFF_COS.title=Derivative of cosine
rule.DIFF_COS.text=(cos(${x}))' = −sin(${x}).

rule.DIFF_TAN.title=Derivative of tangent
rule.DIFF_TAN.text=(tan(${x}))' = sec(${x})².

rule.DIFF_COT.title=Derivative of cotangent
rule.DIFF_COT.text=(cot(${x}))' = −csc(${x})².

rule.DIFF_SEC.title=Derivative of secant
rule.DIFF_SEC.text=(sec(${x}))' = sec(${x})·tan(${x}).

rule.DIFF_CSC.title=Derivative of cosecant
rule.DIFF_CSC.text=(csc(${x}))' = −csc(${x})·cot(${x}).

rule.DIFF_ASIN.title=Derivative of arcsine
rule.DIFF_ASIN.text=(asin(${x}))' = 1/√(1 − ${x}²).

rule.DIFF_ACOS.title=Derivative of arccosine
rule.DIFF_ACOS.text=(acos(${x}))' = −1/√(1 − ${x}²).

rule.DIFF_ATAN.title=Derivative of arctangent
rule.DIFF_ATAN.text=(atan(${x}))' = 1/(1 + ${x}²).

rule.DIFF_SINH.title=Derivative of hyperbolic sine
rule.DIFF_SINH.text=(sinh(${x}))' = cosh(${x}).

rule.DIFF_COSH.title=Derivative of hyperbolic cosine
rule.DIFF_COSH.text=(cosh(${x}))' = sinh(${x}).

rule.DIFF_TANH.title=Derivative of hyperbolic tangent
rule.DIFF_TANH.text=(tanh(${x}))' = 1 − tanh(${x})².

rule.DIFF_ABS.title=Derivative of the absolute value
rule.DIFF_ABS.text=(|${x}|)' = ${x}/|${x}|, for ${x} different from 0.

rule.DIFF_ERF.title=Derivative of the error function
rule.DIFF_ERF.text=(erf(${x}))' = (2/√π)·e^(−${x}²).

rule.DIFF_ORDER.title=Higher-order derivative
rule.DIFF_ORDER.text=Derivative number ${k}: we differentiate the previous result again.

# ---- Order of operations
order.parentheses=First, what is inside the parentheses.
order.error.DIVISION_BY_ZERO=You can't divide by 0.
order.error.UNDEFINED=The result is not defined in the real numbers.

order.POWER.title=Power
order.POWER.text=We compute the power ${a}^${b} = ${r}. Powers come before products and sums.
order.FUNCTION.title=Function
order.FUNCTION.text=We evaluate ${f}(${a}) = ${r}. Functions are resolved together with powers, before products and sums.
order.NEGATION.title=Sign change
order.NEGATION.text=We change the sign of ${a}: −${a} = ${r}.
order.MULTIPLICATION.title=Multiplication
order.MULTIPLICATION.text=We multiply ${a} · ${b} = ${r}. Multiplications and divisions come before additions and subtractions, from left to right.
order.DIVISION.title=Division
order.DIVISION.text=We divide ${a} ÷ ${b} = ${r}. Multiplications and divisions come before additions and subtractions, from left to right.
order.ADDITION.title=Addition
order.ADDITION.text=We add ${a} + ${b} = ${r}. Additions and subtractions come last, from left to right.
order.SUBTRACTION.title=Subtraction
order.SUBTRACTION.text=We subtract ${a} − ${b} = ${r}. Additions and subtractions come last, from left to right.

# ---- Limits
rule.LIMIT_CONSTANT.title=Limit of a constant
rule.LIMIT_CONSTANT.text=The limit of a constant is the constant itself.

rule.LIMIT_DIRECT.title=Direct substitution
rule.LIMIT_DIRECT.text=We substitute ${x} = ${a}: the function is continuous at that point, so the limit is the resulting value.

rule.LIMIT_ALGEBRA.title=Limit laws
rule.LIMIT_ALGEBRA.text=We compute the limit of each part and combine them with the limit laws (sum, product and power).

rule.LIMIT_INFINITY_RATIONAL.title=Ratio of polynomials at infinity
rule.LIMIT_INFINITY_RATIONAL.text=At infinity, a ratio of polynomials behaves like the ratio of their highest-degree terms: the numerator has degree ${n} and the denominator has degree ${m}.

rule.LIMIT_LHOPITAL_ZERO.title=L'Hôpital's rule (0/0)
rule.LIMIT_LHOPITAL_ZERO.text=After substituting, numerator and denominator both approach 0 (indeterminate form 0/0). By L'Hôpital's rule, lim f/g = lim f'/g'. We differentiate the numerator ${n} and the denominator ${d} separately.

rule.LIMIT_LHOPITAL_INFINITY.title=L'Hôpital's rule (∞/∞)
rule.LIMIT_LHOPITAL_INFINITY.text=Numerator and denominator both approach infinity (indeterminate form ∞/∞). By L'Hôpital's rule, lim f/g = lim f'/g'. We differentiate the numerator ${n} and the denominator ${d} separately.

rule.LIMIT_PRODUCT_TO_QUOTIENT.title=Product of the form 0·∞
rule.LIMIT_PRODUCT_TO_QUOTIENT.text=This is a product of the form 0·∞. We write it as a quotient: ${n} divided by ${d}, which is an indeterminate form 0/0 or ∞/∞.

rule.LIMIT_COMBINE_FRACTIONS.title=Combine fractions
rule.LIMIT_COMBINE_FRACTIONS.text=The sum has the form ∞ − ∞. We combine the fractions into a single one.

rule.LIMIT_CONJUGATE.title=Multiply by the conjugate
rule.LIMIT_CONJUGATE.text=This has the form ∞ − ∞ with roots. We multiply and divide by the conjugate to remove them: (A − B)(A + B) = A² − B².

rule.LIMIT_EXPONENTIAL_FORM.title=Exponential form
rule.LIMIT_EXPONENTIAL_FORM.text=The power is an indeterminate form (1^∞, 0^0 or ∞^0). We write b^e = e^(e·ln b) and compute the limit of the exponent ${e}·ln(${b}).

rule.LIMIT_SIDES.title=One-sided limits
rule.LIMIT_SIDES.text=We compute the limit from the left and from the right. If they agree, that value is the limit.

rule.LIMIT_OSCILLATES.title=Oscillating function
rule.LIMIT_OSCILLATES.text=The function oscillates without approaching a value: the limit does not exist.

rule.LIMIT_DIFFERENT_SIDES.title=Different one-sided limits
rule.LIMIT_DIFFERENT_SIDES.text=The limits from the left and from the right are different: the limit does not exist.

# ---- Integrals
rule.INT_CONSTANT.title=Integral of a constant
rule.INT_CONSTANT.text=∫ c d${x} = c·${x}.

rule.INT_CONSTANT_MULTIPLE.title=Constant multiple
rule.INT_CONSTANT_MULTIPLE.text=A constant factor comes out of the integral: ∫ c·f d${x} = c·∫ f d${x}. Here c = ${c} and f = ${f}.

rule.INT_SUM.title=Sum rule
rule.INT_SUM.text=The integral of a sum is the sum of the integrals: ∫ (f + g) d${x} = ∫ f d${x} + ∫ g d${x}. We integrate each term.

rule.INT_POWER.title=Power rule
rule.INT_POWER.text=∫ ${x}^n d${x} = ${x}^(n + 1)/(n + 1), for n different from −1. Here n = ${n}.

rule.INT_RECIPROCAL.title=Integral of 1/x
rule.INT_RECIPROCAL.text=∫ 1/${x} d${x} = ln|${x}|.

rule.INT_EXPONENTIAL_E.title=Integral of the exponential
rule.INT_EXPONENTIAL_E.text=∫ e^${x} d${x} = e^${x}.

rule.INT_EXPONENTIAL.title=Exponential with base a
rule.INT_EXPONENTIAL.text=∫ a^${x} d${x} = a^${x}/ln(a), with a = ${a}.

rule.INT_SIN.title=Integral of sine
rule.INT_SIN.text=∫ sin(${x}) d${x} = −cos(${x}).

rule.INT_COS.title=Integral of cosine
rule.INT_COS.text=∫ cos(${x}) d${x} = sin(${x}).

rule.INT_TAN.title=Integral of tangent
rule.INT_TAN.text=∫ tan(${x}) d${x} = −ln|cos(${x})|.

rule.INT_COT.title=Integral of cotangent
rule.INT_COT.text=∫ cot(${x}) d${x} = ln|sin(${x})|.

rule.INT_SEC.title=Integral of secant
rule.INT_SEC.text=∫ sec(${x}) d${x} = ln|sec(${x}) + tan(${x})|.

rule.INT_CSC.title=Integral of cosecant
rule.INT_CSC.text=∫ csc(${x}) d${x} = −ln|csc(${x}) + cot(${x})|.

rule.INT_SEC_SQUARED.title=Integral of sec²
rule.INT_SEC_SQUARED.text=∫ sec²(${x}) d${x} = tan(${x}).

rule.INT_CSC_SQUARED.title=Integral of csc²
rule.INT_CSC_SQUARED.text=∫ csc²(${x}) d${x} = −cot(${x}).

rule.INT_SEC_TAN.title=Integral of sec·tan
rule.INT_SEC_TAN.text=∫ sec(${x})·tan(${x}) d${x} = sec(${x}).

rule.INT_CSC_COT.title=Integral of csc·cot
rule.INT_CSC_COT.text=∫ csc(${x})·cot(${x}) d${x} = −csc(${x}).

rule.INT_SINH.title=Integral of hyperbolic sine
rule.INT_SINH.text=∫ sinh(${x}) d${x} = cosh(${x}).

rule.INT_COSH.title=Integral of hyperbolic cosine
rule.INT_COSH.text=∫ cosh(${x}) d${x} = sinh(${x}).

rule.INT_TANH.title=Integral of hyperbolic tangent
rule.INT_TANH.text=∫ tanh(${x}) d${x} = ln(cosh(${x})).

rule.INT_ATAN_FORM.title=Arctangent form
rule.INT_ATAN_FORM.text=∫ 1/(${x}² + a²) d${x} = (1/a)·atan(${x}/a), with a = ${a}.

rule.INT_ASIN_FORM.title=Arcsine form
rule.INT_ASIN_FORM.text=∫ 1/√(a² − ${x}²) d${x} = asin(${x}/a), with a = ${a}.

rule.INT_LOG_FORM.title=Logarithmic form
rule.INT_LOG_FORM.text=∫ 1/(${x}² − a²) d${x} = (1/(2a))·ln|(${x} − a)/(${x} + a)|, with a = ${a}.

rule.INT_ASINH_FORM.title=Inverse hyperbolic sine form
rule.INT_ASINH_FORM.text=∫ 1/√(${x}² + c) d${x} = ln|${x} + √(${x}² + c)|, with c = ${c}.

rule.INT_EXPAND.title=Expand before integrating
rule.INT_EXPAND.text=We expand the product or power so we can integrate term by term.

rule.INT_SUBSTITUTION.title=Substitution
rule.INT_SUBSTITUTION.text=We take ${s} = ${u}, so d${s} = ${du} d${x}. The integral becomes a function of ${s} alone: ∫ ${g} d${s}.

rule.INT_PARTS.title=Integration by parts
rule.INT_PARTS.text=∫ u dv = u·v − ∫ v du. We take u = ${u} and dv = ${dv} d${x}; then du = ${du} d${x} and v = ${v}.

rule.INT_CYCLE.title=The integral repeats
rule.INT_CYCLE.text=The original integral shows up again. We call I the integral we want: I = (${a}) + (${c})·I. Solving for I, I = (${a})/(1 − (${c})).

rule.LIMIT_DOMINANT_TERMS.title=Dominant terms
rule.LIMIT_DOMINANT_TERMS.text=At infinity each part behaves like its highest-degree term. Here the function looks like ${c}·${x}^(${p}), and the limit follows from that.

rule.LIMIT_ABSOLUTE_VALUE.title=Absolute value on one side
rule.LIMIT_ABSOLUTE_VALUE.text=On this side of ${a}, the sign of what is inside the absolute value does not change. We rewrite it without the absolute value.

rule.INT_POLYNOMIAL_DIVISION.title=Polynomial division
rule.INT_POLYNOMIAL_DIVISION.text=The degree of the numerator ${n} is not smaller than that of the denominator ${d}, so we divide the polynomials: the quotient is ${q} and the remainder is ${r}.
rule.INT_PARTIAL_FRACTIONS.title=Partial fractions
rule.INT_PARTIAL_FRACTIONS.text=We factor the denominator: ${d} = ${factored}. We write the fraction as a sum of simpler fractions, one for each factor and each power, with unknown coefficients. Matching the coefficients of both numerators and solving the linear system gives ${parts}.
rule.INT_QUADRATIC_SPLIT.title=Split the numerator
rule.INT_QUADRATIC_SPLIT.text=The derivative of the denominator ${q} is ${dq}. We write the numerator as a multiple of ${dq} plus a constant, so one part is a logarithmic derivative and the other is a constant over ${q}.
rule.INT_COMPLETE_SQUARE.title=Complete the square
rule.INT_COMPLETE_SQUARE.text=The polynomial ${q} has no rational roots. Completing the square gives ${s}, and after shifting by ${u} the integral takes the arctangent form.
rule.INT_REDUCTION.title=Reduction formula
rule.INT_REDUCTION.text=For ∫ 1/(${x}² + ${d})^${k} d${x} we use the reduction formula ∫ 1/(${x}²+a)^n = ${x}/(2a(n−1)(${x}²+a)^(n−1)) + (2n−3)/(2a(n−1)) ∫ 1/(${x}²+a)^(n−1), which lowers the power by one.
rule.INT_TRIG_ODD_POWER.title=Odd power
rule.INT_TRIG_ODD_POWER.text=There is an odd exponent. We split off one factor ${keep} and write the rest with ${other} using sin²${x} + cos²${x} = 1. The integral becomes ∫ ${r} d${x}, ready for a substitution with ${other}.
rule.INT_TRIG_HALF_ANGLE.title=Half angle
rule.INT_TRIG_HALF_ANGLE.text=With even exponents we use the half-angle formulas: sin²${x} = (1 − cos 2${x})/2 and cos²${x} = (1 + cos 2${x})/2. The integrand becomes ${r}.
rule.INT_TRIG_TAN_SUBSTITUTION.title=Tangent and secant
rule.INT_TRIG_TAN_SUBSTITUTION.text=The exponents are even and their sum is negative. We write the integrand with tan ${x} and sec²${x} using sec²${x} = 1 + tan²${x}: it becomes ${r}. Since sec²${x} is the derivative of tan ${x}, a substitution with the tangent works.
rule.INT_TRIG_TAN_REDUCTION.title=Power of the tangent
rule.INT_TRIG_TAN_REDUCTION.text=For the power ${n} of the tangent we use tan²${x} = sec²${x} − 1. This gives ∫ tan^n ${x} d${x} = tan^(n−1) ${x}/(n−1) − ∫ tan^(n−2) ${x} d${x}.
rule.INT_TRIG_COT_REDUCTION.title=Power of the cotangent
rule.INT_TRIG_COT_REDUCTION.text=For the power ${n} of the cotangent we use cot²${x} = csc²${x} − 1. This gives ∫ cot^n ${x} d${x} = −cot^(n−1) ${x}/(n−1) − ∫ cot^(n−2) ${x} d${x}.
rule.INT_TRIG_SEC_REDUCTION.title=Power of the secant
rule.INT_TRIG_SEC_REDUCTION.text=For the odd power ${n} of the secant we integrate by parts and get ∫ sec^n ${x} d${x} = sec^(n−2) ${x} tan ${x}/(n−1) + (n−2)/(n−1) ∫ sec^(n−2) ${x} d${x}.
rule.INT_TRIG_CSC_REDUCTION.title=Power of the cosecant
rule.INT_TRIG_CSC_REDUCTION.text=For the odd power ${n} of the cosecant we integrate by parts and get ∫ csc^n ${x} d${x} = −csc^(n−2) ${x} cot ${x}/(n−1) + (n−2)/(n−1) ∫ csc^(n−2) ${x} d${x}.
rule.INT_TRIG_PRODUCT_TO_SUM.title=Product to sum
rule.INT_TRIG_PRODUCT_TO_SUM.text=A product of sines and cosines of different angles becomes a sum with sin A cos B = ½[sin(A+B) + sin(A−B)], cos A cos B = ½[cos(A−B) + cos(A+B)] and sin A sin B = ½[cos(A−B) − cos(A+B)]. It becomes ${r}.
rule.INT_TRIG_WEIERSTRASS.title=The tan(x/2) substitution
rule.INT_TRIG_WEIERSTRASS.text=Any rational function of sine and cosine becomes rational with ${s} = tan(${x}/2): sin ${x} = 2${s}/(1+${s}²), cos ${x} = (1−${s}²)/(1+${s}²) and d${x} = 2 d${s}/(1+${s}²). The integral becomes ∫ ${g} d${s}.
rule.INT_RADICAL_SUBSTITUTION.title=Substitution to remove the root
rule.INT_RADICAL_SUBSTITUTION.text=The root of a linear expression goes away with ${s} = ${u}. Then ${x} and d${x} are written with ${s}, and the integral becomes ∫ ${g} d${s}.
rule.INT_RADICAL_COMPLETE_SQUARE.title=Complete the square inside the root
rule.INT_RADICAL_COMPLETE_SQUARE.text=We complete the square in the radicand: ${q} = ${c}. With ${s} = ${shift} (d${s} = d${x}) the integral becomes ∫ ${g} d${s}.
rule.INT_TRIG_SUBSTITUTION_SIN.title=Trigonometric substitution with sine
rule.INT_TRIG_SUBSTITUTION_SIN.text=The radicand ${q} has the form a² − b²${x}². We take ${x} = ${xs}, so d${x} = ${dx} d${s} and the root is ${root} (with cos ${s} > 0). The integral becomes ∫ ${g} d${s}. At the end we go back to ${x} with ${s} = arcsin(${x}/${m}).
rule.INT_TRIG_SUBSTITUTION_TAN.title=Trigonometric substitution with tangent
rule.INT_TRIG_SUBSTITUTION_TAN.text=The radicand ${q} has the form a² + b²${x}². We take ${x} = ${xs}, so d${x} = ${dx} d${s} and the root is ${root}. The integral becomes ∫ ${g} d${s}. At the end we go back to ${x} with ${s} = arctan(${x}/${m}).
rule.INT_TRIG_SUBSTITUTION_SEC.title=Trigonometric substitution with secant
rule.INT_TRIG_SUBSTITUTION_SEC.text=The radicand ${q} has the form b²${x}² − a². We take ${x} = ${xs} (with ${x} > 0), so d${x} = ${dx} d${s} and the root is ${root}. The integral becomes ∫ ${g} d${s}. At the end we go back to ${x} with ${s} = arccos(${m}/|${x}|).
rule.INT_ROOT_DIFFERENCE_FORM.title=Root of a² − x²
rule.INT_ROOT_DIFFERENCE_FORM.text=With c = ${c}, the formula for ∫ √(c − ${x}²) d${x} (which comes from ${x} = √c sin t) is ${x}·√(c − ${x}²)/2 + (c/2)·arcsin(${x}/√c).
rule.INT_ROOT_SUM_FORM.title=Root of x² + c
rule.INT_ROOT_SUM_FORM.text=With c = ${c}, the formula for ∫ √(${x}² + c) d${x} is ${x}·√(${x}² + c)/2 + (c/2)·ln|${x} + √(${x}² + c)|.
