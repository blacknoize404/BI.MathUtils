# English texts for the step-by-step solutions.
# Placeholders like ${name} are replaced with the expression of the matching parameter.

# ---- Presentation
solution.kind.DERIVATIVE.problem=Differentiate ${f} with respect to ${x}.
solution.kind.DERIVATIVE.problem.order=Differentiate ${f} ${k} times with respect to ${x}.
solution.steps=Steps
solution.result=Result
solution.status.SOLVED=Solved.
solution.status.NON_ELEMENTAL=The result exists, but it cannot be written with elementary functions.
solution.status.UNSOLVED=I can't solve this yet.

# ---- General
rule.SIMPLIFY.title=Simplify
rule.SIMPLIFY.text=We simplify the expression.

# ---- Derivatives
rule.DIFF_CONSTANT.title=Derivative of a constant
rule.DIFF_CONSTANT.text=The derivative of a constant is 0.

rule.DIFF_OTHER_VARIABLE.title=Other variable as a constant
rule.DIFF_OTHER_VARIABLE.text=We differentiate with respect to ${x}, so ${y} is treated as a constant and its derivative is 0.

rule.DIFF_VARIABLE.title=Derivative of the variable
rule.DIFF_VARIABLE.text=The derivative of ${x} with respect to ${x} is 1.

rule.DIFF_CONSTANT_MULTIPLE.title=Constant multiple
rule.DIFF_CONSTANT_MULTIPLE.text=A constant factor comes out of the derivative: (c·f)' = c·f'. Here c = ${c} and f = ${f}.

rule.DIFF_SUM.title=Sum rule
rule.DIFF_SUM.text=The derivative of a sum is the sum of the derivatives: (f + g)' = f' + g'. We differentiate each term separately.

rule.DIFF_POWER.title=Power rule
rule.DIFF_POWER.text=(${x}^n)' = n·${x}^(n − 1), with n = ${n}.

rule.DIFF_PRODUCT.title=Product rule
rule.DIFF_PRODUCT.text=(f·g)' = f'·g + f·g'. Here f = ${f} and g = ${g}.

rule.DIFF_QUOTIENT.title=Quotient rule
rule.DIFF_QUOTIENT.text=(f/g)' = (f'·g − f·g') / g². Here f = ${f} and g = ${g}.

rule.DIFF_CHAIN.title=Chain rule
rule.DIFF_CHAIN.text=(F(u))' = F'(u)·u'. We take u = ${u}: we differentiate the outer function with respect to u and multiply by the derivative of u.

rule.DIFF_EXPONENTIAL_E.title=Derivative of the exponential
rule.DIFF_EXPONENTIAL_E.text=(e^${x})' = e^${x}.

rule.DIFF_EXPONENTIAL.title=Exponential with base a
rule.DIFF_EXPONENTIAL.text=(a^${x})' = a^${x}·ln(a), with a = ${a}.

rule.DIFF_LN.title=Derivative of the natural logarithm
rule.DIFF_LN.text=(ln(${x}))' = 1/${x}.

rule.DIFF_POWER_GENERAL.title=Logarithmic differentiation
rule.DIFF_POWER_GENERAL.text=Both the base and the exponent depend on the variable, so we take logarithms: (f^g)' = f^g·(g'·ln(f) + g·f'/f). Here f = ${f} and g = ${g}.

rule.DIFF_SIN.title=Derivative of sine
rule.DIFF_SIN.text=(sin(${x}))' = cos(${x}).

rule.DIFF_COS.title=Derivative of cosine
rule.DIFF_COS.text=(cos(${x}))' = −sin(${x}).

rule.DIFF_TAN.title=Derivative of tangent
rule.DIFF_TAN.text=(tan(${x}))' = sec(${x})².

rule.DIFF_COT.title=Derivative of cotangent
rule.DIFF_COT.text=(cot(${x}))' = −csc(${x})².

rule.DIFF_SEC.title=Derivative of secant
rule.DIFF_SEC.text=(sec(${x}))' = sec(${x})·tan(${x}).

rule.DIFF_CSC.title=Derivative of cosecant
rule.DIFF_CSC.text=(csc(${x}))' = −csc(${x})·cot(${x}).

rule.DIFF_ASIN.title=Derivative of arcsine
rule.DIFF_ASIN.text=(asin(${x}))' = 1/√(1 − ${x}²).

rule.DIFF_ACOS.title=Derivative of arccosine
rule.DIFF_ACOS.text=(acos(${x}))' = −1/√(1 − ${x}²).

rule.DIFF_ATAN.title=Derivative of arctangent
rule.DIFF_ATAN.text=(atan(${x}))' = 1/(1 + ${x}²).

rule.DIFF_SINH.title=Derivative of hyperbolic sine
rule.DIFF_SINH.text=(sinh(${x}))' = cosh(${x}).

rule.DIFF_COSH.title=Derivative of hyperbolic cosine
rule.DIFF_COSH.text=(cosh(${x}))' = sinh(${x}).

rule.DIFF_TANH.title=Derivative of hyperbolic tangent
rule.DIFF_TANH.text=(tanh(${x}))' = 1 − tanh(${x})².

rule.DIFF_ABS.title=Derivative of the absolute value
rule.DIFF_ABS.text=(|${x}|)' = ${x}/|${x}|, for ${x} different from 0.

rule.DIFF_ERF.title=Derivative of the error function
rule.DIFF_ERF.text=(erf(${x}))' = (2/√π)·e^(−${x}²).

rule.DIFF_ORDER.title=Higher-order derivative
rule.DIFF_ORDER.text=Derivative number ${k}: we differentiate the previous result again.
